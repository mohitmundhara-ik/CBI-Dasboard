<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS · FDE Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ JARVIS DESIGN TOKENS ============
   Deep midnight base, layered mesh gradients, cyan/violet signal palette.
   Depth comes from stacked translucent surfaces and light, not heavy shadow. */
:root{
  --bg:#05070E; --bg2:#080B16; --panel:rgba(18,24,42,.72); --panel2:rgba(24,32,54,.6);
  --line:rgba(120,160,255,.13); --line2:rgba(120,160,255,.24);
  --ink:#EAF0FF; --ink2:#9DAAC9; --ink3:#5F6D8C;
  --cy:#22D3EE; --cy2:#0EA5C6; --vi:#8B5CF6; --in:#4F7DF3;
  --gr:#34D399; --am:#FBBF24; --rd:#F43F5E; --mg:#E879F9;
  --r:14px; --r2:20px;
  --glow-cy:0 0 0 1px rgba(34,211,238,.3), 0 8px 32px -8px rgba(34,211,238,.35);
  --t:.22s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
/* layered ambient field — the "depth" of the product */
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1100px 700px at 12% -8%, rgba(79,125,243,.20), transparent 62%),
   radial-gradient(900px 600px at 88% 4%, rgba(139,92,246,.17), transparent 60%),
   radial-gradient(1200px 800px at 50% 108%, rgba(34,211,238,.11), transparent 62%);}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(120,160,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,160,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(circle at 50% 34%, #000 12%, transparent 74%)}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:13px 22px;backdrop-filter:blur(20px) saturate(150%);
  background:linear-gradient(180deg,rgba(5,7,14,.94),rgba(5,7,14,.72));
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.16em;font-size:14px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--cy);
  box-shadow:0 0 14px 3px rgba(34,211,238,.7);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.84)}}
.nav{display:flex;gap:3px;margin-left:14px}
.nav button{background:none;border:none;color:var(--ink3);font:600 13.5px Inter;letter-spacing:.06em;
  padding:8px 15px;border-radius:10px;cursor:pointer;transition:var(--t);position:relative}
.nav button:hover{color:var(--ink);background:rgba(120,160,255,.08)}
.nav button.on{color:var(--ink);background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.14));
  box-shadow:inset 0 0 0 1px var(--line2)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 11.5px Inter;letter-spacing:.04em;
  padding:5px 12px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2);
  background:rgba(120,160,255,.06);white-space:nowrap}
.chip b{color:var(--ink)}
.chip.warn{border-color:rgba(251,191,36,.4);color:var(--am);background:rgba(251,191,36,.08)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.askbtn{display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
  font:700 13px Inter;color:#04121A;padding:9px 18px;border-radius:22px;
  background:linear-gradient(135deg,var(--cy),#67E8F9 45%,var(--vi));
  box-shadow:0 6px 26px -6px rgba(34,211,238,.6);transition:var(--t)}
.askbtn:hover{transform:translateY(-1px);box-shadow:0 10px 34px -6px rgba(34,211,238,.8)}
.askbtn kbd{font:500 10.5px JetBrains Mono;background:rgba(0,0,0,.22);padding:2px 6px;border-radius:5px}

/* ---------- layout ---------- */
.wrap{flex:1;padding:26px 22px 90px;max-width:1560px;margin:0 auto;width:100%}
.lenses{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.lenses button{background:rgba(120,160,255,.05);border:1px solid var(--line);color:var(--ink2);
  font:600 12.5px Inter;padding:7px 15px;border-radius:20px;cursor:pointer;transition:var(--t)}
.lenses button:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.lenses button.on{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(139,92,246,.16));
  border-color:rgba(34,211,238,.45);color:var(--ink)}
h1.pg{font:800 27px Inter;letter-spacing:-.028em;margin-bottom:5px}
p.sub{color:var(--ink2);font-size:14px;max-width:70ch;margin-bottom:20px}
h3.sec{font:700 12px Inter;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  margin:30px 0 13px;display:flex;align-items:center;gap:11px}
h3.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}

/* ---------- the depth card: tilt + pointer light ---------- */
.card{position:relative;border-radius:var(--r2);padding:18px 20px;overflow:hidden;
  background:linear-gradient(160deg,rgba(28,38,64,.7),rgba(14,19,34,.62));
  border:1px solid var(--line);transition:transform var(--t),border-color var(--t),box-shadow var(--t);
  transform-style:preserve-3d}
.card:before{content:"";position:absolute;inset:0;opacity:0;transition:opacity var(--t);
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(34,211,238,.14),transparent 42%)}
.card:after{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.5),transparent);opacity:.5}
.card:hover,.card:focus-within{border-color:var(--line2);
  box-shadow:0 20px 50px -22px rgba(0,0,0,.9),0 0 0 1px rgba(34,211,238,.14)}
.card:hover:before{opacity:1}
.card.tilt:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
.card .lab{font:600 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.card .val{font:800 34px Inter;letter-spacing:-.035em;line-height:1.08;margin-top:5px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#fff,#A5B4FC);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.card .meta{font-size:12.5px;color:var(--ink2);margin-top:5px}
.card.click{cursor:pointer}
.up{color:var(--gr)}.dn{color:var(--rd)}.flat{color:var(--ink3)}

/* ---------- reveal-on-hover, with focus + touch parity ---------- */
.reveal{max-height:0;opacity:0;overflow:hidden;transition:max-height .3s ease,opacity .22s ease,margin .3s ease}
.card:hover .reveal,.card:focus-within .reveal,.card.open .reveal{max-height:240px;opacity:1;margin-top:11px}
.reveal .rl{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0;
  border-top:1px solid var(--line);color:var(--ink2)}
.reveal .rl b{color:var(--ink);font-variant-numeric:tabular-nums}
.more{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:8px;
  border:1px solid var(--line);background:rgba(120,160,255,.07);color:var(--ink3);
  display:none;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
@media(hover:none){.more{display:flex}}

/* ---------- tables ---------- */
.tw{border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:520px;
  background:rgba(10,14,26,.5)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;z-index:2;text-align:left;font:600 11px Inter;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink3);padding:11px 13px;
  background:linear-gradient(180deg,rgba(14,19,34,.99),rgba(14,19,34,.93));
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid rgba(120,160,255,.07);color:var(--ink2)}
td b{color:var(--ink);font-weight:600}
tr{transition:background var(--t)}
tbody tr:hover{background:linear-gradient(90deg,rgba(34,211,238,.09),transparent)}
tr.click{cursor:pointer}
.n{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:JetBrains Mono,monospace;font-size:12px}
.pill{display:inline-block;font:600 10.5px Inter;letter-spacing:.04em;padding:2px 9px;border-radius:11px;
  border:1px solid var(--line2);color:var(--ink2);background:rgba(120,160,255,.07)}
.pill.g{color:var(--gr);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.pill.a{color:var(--am);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.pill.r{color:var(--rd);border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.1)}
.pill.v{color:var(--mg);border-color:rgba(232,121,249,.4);background:rgba(232,121,249,.1)}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:200;pointer-events:none;opacity:0;transition:opacity .13s;
  background:rgba(10,15,28,.97);border:1px solid var(--line2);border-radius:11px;padding:11px 14px;
  font-size:12px;max-width:300px;backdrop-filter:blur(14px);
  box-shadow:0 16px 46px -12px rgba(0,0,0,.95)}
#tip.on{opacity:1}
#tip b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:3px}
#tip span{color:var(--ink2);display:block;line-height:1.5}
#tip .k{color:var(--cy);font-family:JetBrains Mono;font-size:11px}

/* ---------- panels / drawers ---------- */
.scrim{position:fixed;inset:0;z-index:120;background:rgba(3,5,11,.76);backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity var(--t)}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);z-index:121;
  background:linear-gradient(160deg,rgba(16,22,40,.99),rgba(9,13,25,.99));
  border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-30px 0 80px -20px rgba(0,0,0,.9)}
.panel.on{transform:none}
.phead{padding:20px 24px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.phead .t{font:800 20px Inter;letter-spacing:-.02em}
.phead .c{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pbody{flex:1;overflow:auto;padding:20px 24px 40px}
.x{margin-left:auto;background:rgba(120,160,255,.09);border:1px solid var(--line);color:var(--ink2);
  width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;flex-shrink:0;transition:var(--t)}
.x:hover{background:rgba(244,63,94,.16);color:var(--rd);border-color:rgba(244,63,94,.4)}

/* ---------- mobile ---------- */
@media(max-width:820px){
  .wrap{padding:18px 14px 100px}
  .nav{display:none}
  h1.pg{font-size:22px}
  .card .val{font-size:28px}
  .dock{display:flex}
  .panel{width:100vw;top:auto;height:88vh;border-radius:22px 22px 0 0;border-left:none;
    border-top:1px solid var(--line2);transform:translateY(100%)}
  .panel.on{transform:none}
}
.dock{display:none;position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:linear-gradient(0deg,rgba(5,7,14,.99),rgba(5,7,14,.9));
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter:blur(20px)}
.dock button{flex:1;background:none;border:none;color:var(--ink3);font:600 10.5px Inter;
  letter-spacing:.08em;padding:8px 4px;border-radius:11px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:4px;transition:var(--t)}
.dock button .ic{font-size:16px;line-height:1}
.dock button.on{color:var(--cy);background:rgba(34,211,238,.11)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
  <div class="top">
    <div class="brand"><span class="dot"></span><span id="brandName">JARVIS</span></div>
    <div class="nav" id="nav"></div>
    <div class="spacer"></div>
    <span id="fresh"></span>
    <button class="askbtn" onclick="askOpen()">Ask JARVIS <kbd>hold space</kbd></button>
  </div>
  <div class="wrap"><div class="lenses" id="lenses"></div><div id="page"></div></div>
  <div class="dock" id="dock"></div>
</div>
<div id="tip"></div>
<div class="scrim" id="scrim" onclick="panelClose()"></div>
<div class="panel" id="panel">
  <div class="phead"><div><div class="t" id="pTitle"></div><div class="c" id="pCtx"></div></div>
    <button class="x" onclick="panelClose()">✕</button></div>
  <div class="pbody" id="pBody"></div>
</div>

   Four destinations: CORE, FLOW, AGENTS, VAULT.
   All logic written fresh against the raw extracts. Nothing inherited. */
const NAME = "JARVIS";
let D = null, TAB = "core", LENS = "outcome", PIN = null;

const $ = id => document.getElementById(id);
/* One place to stash row-sets that click handlers reach by index. Declared so
   it works whether or not a global `window` exists. */
const STASH = {};
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = v => (v==null||isNaN(v)) ? "—" : Number(v).toLocaleString("en-IN");
const inr = v => "₹" + Math.round(v).toLocaleString("en-IN");
const pctv = (a,b) => b ? (a/b*100) : 0;
const pct = (a,b) => b ? (a/b*100).toFixed(1)+"%" : "—";

async function unzip(b64){
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const txt = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  return JSON.parse(txt);
}

/* ---------- metric contract: every number here is defined once ---------- */
const M = {
  leads:  {n:"Registrations", d:"One row per lead per webinar.", f:"count(rows)", k:"observed"},
  people: {n:"Unique people", d:"Distinct lead id across the selection.", f:"count(distinct id)", k:"derived"},
  att:    {n:"Attended", d:"Has a webinar attendance date.", f:"webinar_attended_date is not null", k:"observed"},
  show:   {n:"Show rate", d:"Attended over registrations in the same cohort.", f:"att / leads", k:"derived"},
  dcd:    {n:"Discovery done", d:"CRM flag that a discovery call happened.", f:"DCD_Flag > 0", k:"observed"},
  rte:    {n:"Ready to enrol", d:"CRM flag that the lead is ready to buy.", f:"RTE_Flag > 0", k:"observed"},
  won:    {n:"Enrolled", d:"Has a sale date on or after the campaign start.", f:"sale_date >= 2026-07-27", k:"derived"},
  open:   {n:"Open pipeline", d:"Ready-to-enrol not yet closed, at the median deal.", f:"rte_open × 190000", k:"assumed"},
  effort: {n:"Follow-through", d:"Post-webinar dials as a share of pre-webinar dials.", f:"sum(post) / sum(pre)", k:"derived"},
  cac:    {n:"Cost per registration", d:"Not available — no spend source is connected.", f:"—", k:"missing"},
};
const START = "2026-07-27";
const DEAL = 190000;   // median of 1,595 IK sales, May 2025 – Apr 2026

/* ---------- selectors ---------- */
const L = () => D ? D.leads : [];
const byWeb = () => {
  const g = {};
  L().forEach(r => { const k = r.wd || "undated"; (g[k] = g[k] || []).push(r) });
  return Object.keys(g).sort().map(k => ({date:k, rows:g[k]}));
};
const S = rows => ({
  leads: rows,
  att: rows.filter(r => r.att === 1),
  dcd: rows.filter(r => r.dcd === 1),
  rte: rows.filter(r => r.rte === 1),
  won: rows.filter(r => r.sale && r.sale >= START),
  people: new Set(rows.map(r => r.id)).size,
});
const scope = () => {
  let rows = L();
  if(PIN && PIN.f) rows = rows.filter(r => String(r[PIN.f]) === PIN.v);
  return rows;
};

/* ---------- hover: tooltip + pointer light + tilt ---------- */
function tipOn(e, title, body, key){
  const t = $("tip");
  t.innerHTML = `<b>${esc(title)}</b><span>${body}</span>${key?`<span class="k">${esc(key)}</span>`:""}`;
  t.classList.add("on");
  const w = t.offsetWidth, h = t.offsetHeight, p = 16;
  let x = e.clientX + p, y = e.clientY - h - p;
  if(x + w > innerWidth - 10) x = e.clientX - w - p;
  if(y < 10) y = e.clientY + p;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function tipOff(){ $("tip").classList.remove("on") }
/* Pointer-following light and a small tilt. Cheap: transform + one gradient. */
function tilt(e, el){
  const b = el.getBoundingClientRect();
  const px = (e.clientX - b.left) / b.width, py = (e.clientY - b.top) / b.height;
  el.style.setProperty("--mx", (px*100)+"%");
  el.style.setProperty("--my", (py*100)+"%");
  el.style.setProperty("--ry", ((px-.5)*7).toFixed(2)+"deg");
  el.style.setProperty("--rx", ((.5-py)*7).toFixed(2)+"deg");
}
function bindCards(){
  document.querySelectorAll(".card").forEach(el => {
    if(el._b) return; el._b = 1;
    el.addEventListener("mousemove", e => tilt(e, el));
    el.addEventListener("mouseleave", () => { el.style.removeProperty("--ry"); el.style.removeProperty("--rx") });
    el.setAttribute("tabindex","0");   /* keyboard parity with hover */
  });
}
function toggleCard(btn){ btn.closest(".card").classList.toggle("open"); event.stopPropagation() }

/* Any element can carry hover context via data attributes. */
function hov(title, body, key){
  const b = String(body).replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  const t = String(title).replace(/"/g,"&quot;");
  return `onmousemove="tipOn(event,'${t}','${b}'${key?`,'${key}'`:""})" onmouseleave="tipOff()"
          onfocus="tipOn({clientX:this.getBoundingClientRect().left+40,clientY:this.getBoundingClientRect().top+30},'${t}','${b}'${key?`,'${key}'`:""})"
          onblur="tipOff()"`;
}

}

function records(title, rows){

    ["role","Role"],["pa","Advisor"],["st","Status"],["atm","Dials"],["tt","Minutes"]];

    ${cols.map(c => `<th class="${["atm","tt"].includes(c[0])?"n":""}">${c[1]}</th>`).join("")}
    </tr></thead><tbody>${rows.slice(0,300).map(r => `<tr class="click" onclick="lead360('${esc(r.id)}')">
      ${cols.map(c => `<td class="${["atm","tt"].includes(c[0])?"n":""}">${

}

/* ============ CORE ============ */
function ringSVG(st){
  const R = [
    {k:"Acquisition", v:st.showR,  c:"var(--in)", r:132},
    {k:"Engagement",  v:st.dcdR,   c:"var(--cy)", r:110},
    {k:"Conversion",  v:st.rteR,   c:"var(--vi)", r:88},
    {k:"Revenue",     v:st.wonR,   c:"var(--gr)", r:66},
    {k:"Data health", v:st.health, c:"var(--am)", r:44},
  ];
  return `<svg viewBox="0 0 320 320" style="width:100%;max-width:340px;display:block;margin:0 auto">
    <defs><radialGradient id="cg"><stop offset="0%" stop-color="rgba(34,211,238,.42)"/>
      <stop offset="70%" stop-color="rgba(139,92,246,.12)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
      <filter id="gl"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <circle cx="160" cy="160" r="150" fill="url(#cg)"/>
    ${R.map(x => {
      const c = 2*Math.PI*x.r, on = c * Math.max(Math.min(x.v,1),0.015);
      return `<circle cx="160" cy="160" r="${x.r}" fill="none" stroke="rgba(120,160,255,.1)" stroke-width="7"/>
      <circle cx="160" cy="160" r="${x.r}" fill="none" stroke="${x.c}" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${on.toFixed(1)} ${(c-on).toFixed(1)}" transform="rotate(-90 160 160)"
        filter="url(#gl)" style="cursor:pointer"
        ${hov(x.k, (x.v*100).toFixed(1)+"% of the step before it")}/>`}).join("")}
    <circle cx="160" cy="160" r="30" fill="rgba(10,15,28,.9)" stroke="var(--line2)"/>
    <text x="160" y="156" text-anchor="middle" fill="var(--ink)" font-size="19" font-weight="800"
      font-family="Inter">${st.leads}</text>
    <text x="160" y="171" text-anchor="middle" fill="var(--ink3)" font-size="8.5"
      letter-spacing="1.4" font-family="Inter">LEADS</text>
  </svg>`;
}

function pageCore(){
  const cohorts = byWeb().filter(c => c.date !== "undated");
  const cur = cohorts[cohorts.length-1] || {date:"—", rows:[]};
  const prv = cohorts[cohorts.length-2] || null;
  const A = S(cur.rows), B = prv ? S(prv.rows) : null;
  const st = {
    leads: A.leads.length,
    showR: pctv(A.att.length, A.leads.length)/100,
    dcdR:  pctv(A.dcd.length, A.att.length)/100,
    rteR:  pctv(A.rte.length, A.dcd.length)/100,
    wonR:  pctv(A.won.length, Math.max(A.rte.length,1))/100,
    health: 0.55,
  };
  const d = (a,b) => b==null ? "" : (a-b>0?`<span class="up">▲ ${a-b}</span>`:a-b<0?`<span class="dn">▼ ${b-a}</span>`:`<span class="flat">—</span>`);
  const openP = A.rte.filter(r => !(r.sale && r.sale >= START));

  const steps = [
    ["Registered", A.leads, B&&B.leads, null, M.leads],
    ["Attended",   A.att,   B&&B.att,   A.leads, M.att],
    ["Discovery",  A.dcd,   B&&B.dcd,   A.att,   M.dcd],
    ["Ready",      A.rte,   B&&B.rte,   A.dcd,   M.rte],
    ["Enrolled",   A.won,   B&&B.won,   A.rte,   M.won],
  ];

  /* drivers, recomputed from the two cohorts */
  const drivers = [];
  if(B){
    const s1 = pctv(A.att.length,A.leads.length), s0 = pctv(B.att.length,B.leads.length);
    if(Math.abs(s1-s0) > 3) drivers.push({
      t:`Show rate ${s1>s0?"rose":"fell"} to ${s1.toFixed(0)}% from ${s0.toFixed(0)}%`,
      b:`That is ${Math.abs(Math.round((s1-s0)/100*A.leads.length))} ${s1>s0?"more":"fewer"} people in the room on ${A.leads.length} registrations.`,
      tone:s1>s0?"g":"r", rows:A.att});
    const mix = (rows,f) => { const c={}; rows.forEach(r=>{const v=r[f]||"(none)";c[v]=(c[v]||0)+1}); return c };
    const m1=mix(A.leads,"ch"), m0=mix(B.leads,"ch");
    const sh = Object.keys({...m1,...m0}).map(k=>({k,
      d:(m1[k]||0)/A.leads.length-(m0[k]||0)/B.leads.length})).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
    if(sh[0] && Math.abs(sh[0].d) > .06) drivers.push({
      t:`${sh[0].k} moved ${sh[0].d>0?"up":"down"} ${Math.abs(sh[0].d*100).toFixed(0)} points of the mix`,
      b:`Sources convert at different rates, so a mix change moves the sale count before any selling changes.`,
      tone:"a", rows:A.leads.filter(r=>r.ch===sh[0].k)});
    const eff = rows => { const p=rows.reduce((a,r)=>a+r.pre,0); return p ? rows.reduce((a,r)=>a+r.post,0)/p : null };
    const e1=eff(A.leads), e0=eff(B.leads);
    if(e1!=null && e0!=null && Math.abs(e1-e0)>.08) drivers.push({
      t:`Follow-through ${e1>e0?"rose":"fell"} to ${(e1*100).toFixed(0)}% of pre-webinar dialling`,
      b:`Interest peaks straight after the session. ${e1<e0?"The push is easing exactly when it should intensify.":"Holding better than last time."}`,
      tone:e1>e0?"g":"r", rows:A.att.filter(r=>r.post===0)});
  }
  STASH.DR = drivers.map(x => x.rows);

  /* actions */
  const acts = [];
  if(openP.length) acts.push({t:`Close ${openP.length} leads already flagged ready to enrol`,
    w:"They agreed to the next step and no sale is recorded. IK history: 43% of sales close within a week of the lead.",
    v:`${inr(openP.length*DEAL*.35)} – ${inr(openP.length*DEAL*.5)}`, c:"Medium", e:"Low", rows:openP});
  const cold = A.att.filter(r => r.post === 0);
  if(cold.length) acts.push({t:`Call ${cold.length} attendees never rung since the webinar`,
    w:"Attendance is the strongest signal in this data and it decays within days.",
    v:`${inr(cold.length*.04*DEAL)} at the observed attendee rate`, c:"Medium", e:"Medium", rows:cold});
  const noPa = scope().filter(r => !r.pa);
  if(noPa.length) acts.push({t:`Assign an owner to ${noPa.length} leads with no advisor`,
    w:"An unowned lead is nobody's job. This is a routing fix, not a selling one.",
    v:"Removes a routing leak", c:"High", e:"Low", rows:noPa});
  STASH.AC = acts.map(a => a.rows);

  let h = `<h1 class="pg">Core</h1>
   <p class="sub">Latest webinar <b>${esc(cur.date)}</b>${prv?` against <b>${esc(prv.date)}</b>`:""} ·
   ${A.leads.length} registrations · ${A.people} unique people. Hover anything for its definition; click for its records.</p>

   <div class="grid" style="grid-template-columns:minmax(280px,380px) 1fr;align-items:start">
     <div class="card" style="padding:22px">
       <div class="lab">System state</div>
       ${ringSVG(st)}
       <div style="display:grid;gap:6px;margin-top:12px">
         ${[["Acquisition",st.showR,"var(--in)"],["Engagement",st.dcdR,"var(--cy)"],
            ["Conversion",st.rteR,"var(--vi)"],["Revenue",st.wonR,"var(--gr)"],
            ["Data health",st.health,"var(--am)"]].map(([k,v,c]) =>
           `<div class="rl" style="display:flex;justify-content:space-between;font-size:12px;
             padding:5px 0;border-top:1px solid var(--line);color:var(--ink2)">
             <span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;
               background:${c};margin-right:8px"></i>${k}</span>
             <b style="color:var(--ink)">${(v*100).toFixed(0)}%</b></div>`).join("")}
       </div>
       <div class="meta" style="margin-top:10px">Data health is 55% because call analysis covers part of the base and no spend source is connected.</div>
     </div>

     <div>
       <div class="grid g3">
         ${steps.map(([k,now,was,from,m],i) => `
           <div class="card tilt click" onclick="records('${esc(k)}',STASH.ST[${i}])"
             ${hov(m.n, m.d + " · " + m.f, m.k)}>
             <button class="more" onclick="toggleCard(this)">⋯</button>
             <div class="lab">${esc(k)}</div>
             <div class="val">${nf(now.length)}</div>
             <div class="meta">${d(now.length, was?was.length:null)}
               ${from?`<span style="color:var(--ink3)"> · ${pct(now.length, from.length)} of previous</span>`:""}</div>
             <div class="reveal">
               <div class="rl"><span>Definition</span><b>${esc(m.k)}</b></div>
               <div class="rl"><span>Formula</span><b class="mono">${esc(m.f)}</b></div>
               <div class="rl"><span>Unique people</span><b>${new Set(now.map(r=>r.id)).size}</b></div>
             </div>
           </div>`).join("")}
       </div>
       <div class="grid g2" style="margin-top:14px">
         <div class="card" ${hov(M.open.n, M.open.d, M.open.k)}>
           <div class="lab">Open pipeline</div><div class="val">${inr(openP.length*DEAL)}</div>
           <div class="meta">${openP.length} ready-to-enrol × ${inr(DEAL)} median deal</div></div>
         <div class="card" ${hov(M.cac.n, M.cac.d, M.cac.k)}>
           <div class="lab">Cost per registration</div>
           <div class="val" style="-webkit-text-fill-color:var(--ink3)">—</div>
           <div class="meta">No spend source connected. CAC and ROAS cannot be computed.</div></div>
       </div>
     </div>
   </div>`;
  STASH.ST = steps.map(s => s[1]);

  h += `<h3 class="sec">What changed, and why</h3>`;
  h += drivers.length ? `<div class="grid g2">${drivers.map((x,i)=>`
      <div class="card tilt click" onclick="records('${esc(x.t)}',STASH.DR[${i}])">
        <span class="pill ${x.tone}">${x.tone==="g"?"improving":x.tone==="r"?"deteriorating":"watch"}</span>
        <div style="font:700 15px Inter;margin-top:9px;line-height:1.35">${esc(x.t)}</div>
        <div class="meta" style="margin-top:6px">${esc(x.b)}</div>
        <div class="meta" style="margin-top:9px;color:var(--cy)">${x.rows.length} records →</div>
      </div>`).join("")}</div>`
    : `<div class="card"><div class="meta">Nothing moved enough between these two webinars to call a driver.</div></div>`;
  h += `<p class="sub" style="margin-top:11px;font-size:12.5px">Differences between two cohorts, not proven causes.
    With two webinars there is no way to separate a real effect from normal variation.</p>`;

  h += `<h3 class="sec">Recommended next</h3><div class="grid g2">
    ${acts.map((a,i)=>`<div class="card tilt">
      <div style="font:700 15px Inter;line-height:1.35">${esc(a.t)}</div>
      <div class="meta" style="margin-top:7px">${esc(a.w)}</div>
      <div class="grid g3" style="margin-top:13px;gap:9px">
        ${[["Expected",a.v],["Confidence",a.c],["Effort",a.e]].map(([k,v])=>
          `<div><div class="lab" style="font-size:9.5px">${k}</div>
           <div style="font-size:12.5px;color:var(--ink);margin-top:2px">${esc(v)}</div></div>`).join("")}
      </div>
      ${a.rows.length?`<button class="askbtn" style="margin-top:13px;font-size:12px;padding:7px 14px"
        onclick="records('${esc(a.t)}',STASH.AC[${i}])">Open ${a.rows.length} records</button>`:""}
    </div>`).join("")}</div>`;
  return h;
}

/* ============ FLOW ============
   The journey as a connected graph. Hovering a node lights its path; clicking
   pins it and cross-filters everything else on the page. */
const LENSES = [["outcome","Outcome"],["audience","Audience"],["channel","Channel"],
                ["partner","Partner"],["quality","Data quality"]];
function setLens(k){ LENS = k; render() }
function pin(f, v){ PIN = (PIN && PIN.f===f && PIN.v===v) ? null : {f, v}; render() }
function unpin(){ PIN = null; render() }

function flowNodes(rows){
  const s = S(rows);
  return [
    {k:"Market",       n:D.jobs.length, sub:"live FDE postings", c:"var(--vi)", f:null},
    {k:"Registered",   n:s.leads.length, sub:"lead-webinar rows", c:"var(--in)", rows:s.leads},
    {k:"Attended",     n:s.att.length,  sub:pct(s.att.length,s.leads.length)+" show", c:"var(--cy)", rows:s.att},
    {k:"Discovery",    n:s.dcd.length,  sub:pct(s.dcd.length,s.att.length)+" of attendees", c:"var(--cy)", rows:s.dcd},
    {k:"Ready",        n:s.rte.length,  sub:pct(s.rte.length,s.dcd.length)+" of discovery", c:"var(--mg)", rows:s.rte},
    {k:"Enrolled",     n:s.won.length,  sub:inr(s.won.length*DEAL), c:"var(--gr)", rows:s.won},
  ];
}
function pageFlow(){
  const rows = scope();
  const nodes = flowNodes(rows);
  STASH.FN = nodes.map(n => n.rows || []);
  const dimOf = {outcome:"st", audience:"ex", channel:"ch", partner:"ch", quality:"pa"}[LENS] || "ch";
  const dimLab = {outcome:"Lead status", audience:"Experience", channel:"Channel",
                  partner:"Channel / partner", quality:"Advisor"}[LENS];

  const g = {};
  rows.forEach(r => { const k = r[dimOf] || "(not set)"; (g[k] = g[k] || []).push(r) });
  const cuts = Object.entries(g).map(([k,v]) => {
    const s = S(v);
    return {k, n:v.length, att:s.att.length, dcd:s.dcd.length, rte:s.rte.length, won:s.won.length, rows:v};
  }).sort((a,b) => b.n - a.n);
  STASH.FC = cuts.map(c => c.rows);
  const maxN = Math.max(...cuts.map(c => c.n), 1);

  let h = `<h1 class="pg">Flow</h1>
   <p class="sub">The whole journey as one connected path. Hover a node for its definition and drivers;
   click to pin it and cross-filter everything below.
   ${PIN?`<button class="pill v" style="cursor:pointer;margin-left:8px" onclick="unpin()">
     ${esc(PIN.v)} ✕ clear</button>`:""}</p>

   <div class="card" style="padding:26px 22px;overflow-x:auto">
     <div style="display:flex;align-items:stretch;gap:0;min-width:760px">
       ${nodes.map((x,i) => `
         <div style="flex:1;display:flex;align-items:center">
           <div class="card tilt click" style="flex:1;background:linear-gradient(160deg,rgba(30,40,68,.75),rgba(14,19,34,.6));padding:15px 16px"
             onclick="${x.rows?`records('${esc(x.k)}',STASH.FN[${i}])`:`go('vault')`}"
             ${hov(x.k, x.sub)}>
             <div class="lab" style="color:${x.c}">${esc(x.k)}</div>
             <div class="val" style="font-size:27px">${nf(x.n)}</div>
             <div class="meta" style="font-size:11.5px">${esc(x.sub)}</div>
           </div>
           ${i<nodes.length-1?`<div style="width:34px;display:flex;align-items:center;justify-content:center;
             color:var(--ink3);font-size:17px" ${hov("Step conversion",
               nodes[i+1].n+" of "+x.n+" carried through · "+pct(nodes[i+1].n,x.n))}>→</div>`:""}
         </div>`).join("")}
     </div>
   </div>

   <h3 class="sec">${esc(dimLab)} lens</h3>
   <div class="tw"><table><thead><tr><th>${esc(dimLab)}</th><th class="n">Leads</th>
     <th style="min-width:150px">Share</th><th class="n">Attended</th><th class="n">Show</th>
     <th class="n">Discovery</th><th class="n">Ready</th><th class="n">Enrolled</th></tr></thead><tbody>
     ${cuts.map((c,i) => `<tr class="click" onclick="pin('${dimOf}','${esc(c.k)}')"
       ${hov(c.k, c.n+" leads · "+pct(c.att,c.n)+" show rate · "+c.won+" enrolled")}>
       <td><b>${esc(c.k)}</b>${PIN&&PIN.v===c.k?' <span class="pill v">pinned</span>':""}</td>
       <td class="n">${c.n}</td>
       <td><div style="height:7px;border-radius:4px;background:rgba(120,160,255,.1);overflow:hidden">
         <div style="height:100%;width:${(c.n/maxN*100).toFixed(1)}%;border-radius:4px;
           background:linear-gradient(90deg,var(--in),var(--cy))"></div></div></td>
       <td class="n">${c.att}</td>
       <td class="n" style="color:${pctv(c.att,c.n)>55?"var(--gr)":pctv(c.att,c.n)<35?"var(--rd)":"var(--am)"}">
         ${pct(c.att,c.n)}</td>
       <td class="n">${c.dcd}</td><td class="n">${c.rte}</td>
       <td class="n"><b>${c.won||""}</b></td></tr>`).join("")}
   </tbody></table></div>
   <p class="sub" style="margin-top:10px;font-size:12.5px">Click a row to pin it. Every number above opens its records.</p>`;
  return h;
}

/* ============ LEAD 360 ============ */
function lead360(id){
  const rows = L().filter(r => r.id === id);
  if(!rows.length) return;
  const r = rows[0];
  const ev = [];
  rows.forEach(x => {
    if(x.wd) ev.push({d:x.wd, k:"Webinar", b:x.att?"Attended":"Registered, did not attend", tone:x.att?"g":"a"});
    if(x.sale) ev.push({d:x.sale, k:"Enrolled", b:x.course||"Sale recorded", tone:"g"});
  });
  if(r.atm) ev.push({d:"", k:"Calling", b:`${r.atm} dials · ${r.con} connects · ${r.tt.toFixed(1)} min`, tone:""});
  if(r.dcd) ev.push({d:"", k:"Discovery", b:"Discovery call completed", tone:"g"});
  if(r.rte) ev.push({d:"", k:"Ready", b:"Flagged ready to enrol", tone:"g"});
  ev.sort((a,b) => (a.d||"9").localeCompare(b.d||"9"));

  panel(`Lead ${id}`, `${r.role||"role not set"} · ${r.ex||"experience not set"} · ${r.ch||"channel not set"}`,
   `<div class="grid g3" style="margin-bottom:18px">
      ${[["Advisor",r.pa||"unassigned"],["Status",r.st||"—"],["City",r.city||"—"],
         ["Dials",r.atm],["Connects",r.con],["Minutes",r.tt.toFixed(1)]].map(([k,v])=>
        `<div class="card" style="padding:13px 15px"><div class="lab">${k}</div>
         <div style="font:700 16px Inter;margin-top:4px">${esc(v)}</div></div>`).join("")}
    </div>
    <h3 class="sec">Journey</h3>
    <div style="display:grid;gap:0">
      ${ev.map(e => `<div style="display:grid;grid-template-columns:84px 24px 1fr;gap:12px;padding:12px 0;
        border-bottom:1px solid var(--line);align-items:start">
        <div class="mono" style="color:var(--ink3);font-size:11px;padding-top:3px">${esc(e.d||"undated")}</div>
        <div style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          background:${e.tone==="g"?"rgba(52,211,153,.16)":e.tone==="a"?"rgba(251,191,36,.16)":"rgba(120,160,255,.1)"};
          color:${e.tone==="g"?"var(--gr)":e.tone==="a"?"var(--am)":"var(--ink3)"};font-size:10px">●</div>
        <div><div style="font:700 13.5px Inter">${esc(e.k)}</div>
          <div class="meta" style="margin-top:2px">${esc(e.b)}</div></div>
      </div>`).join("")}
    </div>
    ${rows.length>1?`<p class="sub" style="margin-top:14px">Registered for ${rows.length} webinars — one canonical
      timeline across all of them.</p>`:""}`);
}

/* ============ ASK JARVIS ============
   Deterministic: it computes from loaded rows and cites the definition it used.
   No model call, so no lead data leaves the page. */
let ASK = false, AQ = "";
const A_MEAS = [
  {k:"leads", w:["lead","leads","registration","registrations","how many","volume","count"],
   f:r=>r.length, u:"registrations", def:M.leads},
  {k:"people", w:["people","unique","persons"], f:r=>new Set(r.map(x=>x.id)).size, u:"unique people", def:M.people},
  {k:"att", w:["attend","attended","attendance","came","show","turnout"],
   f:r=>r.filter(x=>x.att).length, u:"attended", rate:1, def:M.att},
  {k:"dcd", w:["discovery","dcd"], f:r=>r.filter(x=>x.dcd).length, u:"discovery calls", rate:1, def:M.dcd},
  {k:"rte", w:["ready","rte","pipeline"], f:r=>r.filter(x=>x.rte).length, u:"ready to enrol", rate:1, def:M.rte},
  {k:"won", w:["sale","sales","sold","enrol","enrols","enrolment","enrolments","enrolled","enrollment","enrollments","convert","converted","conversion","revenue","bought","buyer","buyers"],
   f:r=>r.filter(x=>x.sale&&x.sale>=START).length, u:"enrolments", rate:1, def:M.won},
  {k:"dials", w:["dial","dials","attempt","attempts","calls made"], f:r=>Math.round(r.reduce((a,x)=>a+x.atm,0)), u:"dials"},
  {k:"mins", w:["minute","minutes","talk time","talktime"], f:r=>Math.round(r.reduce((a,x)=>a+x.tt,0)), u:"minutes"},
];
const A_DIMS = [
  {k:"ch", w:["channel","source","where from"], n:"channel"},
  {k:"cmp", w:["campaign","utm"], n:"campaign"},
  {k:"ex", w:["experience","yoe","years","seniority"], n:"experience"},
  {k:"role", w:["role","designation","domain","profile"], n:"role"},
  {k:"cat", w:["category","group","function"], n:"role group"},
  {k:"city", w:["city","location","geography"], n:"city"},
  {k:"pa", w:["advisor","pa","rep","owner","who"], n:"advisor"},
  {k:"pod", w:["team","pod"], n:"team"},
  {k:"wd", w:["webinar","cohort","session","batch"], n:"webinar"},
  {k:"st", w:["status","stage","crm"], n:"status"},
];
function askParse(q){
  const s = " " + q.toLowerCase().replace(/[^\w\s]/g," ") + " ";
  const best = list => { let b=null,len=0;
    list.forEach(x => x.w.forEach(w => { if(s.includes(" "+w+" ")||s.includes(" "+w+"s ")){ if(w.length>len){b=x;len=w.length} } }));
    return b };
  const meas = best(A_MEAS), dim = best(A_DIMS);
  const filters = {};
  A_DIMS.forEach(d => {
    new Set(L().map(r => r[d.k]).filter(Boolean)).forEach(v => {
      const lv = String(v).toLowerCase();
      if(lv.length >= 4 && s.includes(" "+lv+" ")) filters[d.k] = v;
    });
  });
  return {meas, dim, filters};
}
function askRun(q){
  const P = askParse(q);
  if(!P.meas && !P.dim){
    return `<div class="card"><div style="font:700 15px Inter">I cannot answer that from this data</div>
      <div class="meta" style="margin-top:8px">I read the ${L().length} leads loaded here. I can answer volume,
      attendance, calling, pipeline and conversion — cut by channel, campaign, experience, role, city,
      advisor, team, webinar or status.</div>
      <div style="margin-top:12px;display:grid;gap:6px">${
        ["attendance by channel","enrolments by experience","dials by advisor","ready to enrol by webinar"]
        .map(x=>`<button class="pill" style="cursor:pointer;text-align:left;padding:8px 12px"
          onclick="askGo('${x}')">${x}</button>`).join("")}</div></div>`;
  }
  const meas = P.meas || A_MEAS[0];
  let rows = L();
  Object.entries(P.filters).forEach(([k,v]) => { rows = rows.filter(r => String(r[k]) === String(v)) });
  const total = meas.f(rows);
  STASH.AQ = rows;

  let h = `<div class="card" style="padding:22px">
    <div class="lab">${esc(q)}</div>
    <div class="val" style="font-size:46px">${nf(total)}</div>
    <div class="meta">${esc(meas.u)}${meas.rate?` · ${pct(total, rows.length)} of ${rows.length} leads`:` · from ${rows.length} leads`}
      ${Object.keys(P.filters).length?` · filtered to ${Object.values(P.filters).map(esc).join(", ")}`:""}</div>
    ${meas.def?`<div class="meta" style="margin-top:9px;color:var(--ink3)">
      <b style="color:var(--cy)">${esc(meas.def.k)}</b> · ${esc(meas.def.d)}
      <span class="mono"> ${esc(meas.def.f)}</span></div>`:""}
  </div>`;

  if(P.dim){
    const g = {};
    rows.forEach(r => { const k = r[P.dim.k] || "(not set)"; (g[k] = g[k] || []).push(r) });
    const arr = Object.entries(g).map(([k,v]) => ({k, v:meas.f(v), n:v.length, rows:v}))
      .filter(x => x.v > 0).sort((a,b) => b.v - a.v);
    STASH.AG = arr.map(x => x.rows);
    const mx = Math.max(...arr.map(x => x.v), 1);
    h += `<h3 class="sec">By ${esc(P.dim.n)}</h3><div class="tw"><table><thead><tr>
      <th>${esc(P.dim.n)}</th><th class="n">${esc(meas.u)}</th><th style="min-width:160px"></th>
      <th class="n">Leads</th>${meas.rate?'<th class="n">Rate</th>':""}</tr></thead><tbody>
      ${arr.map((x,i) => `<tr class="click" onclick="records('${esc(x.k)}',STASH.AG[${i}])">
        <td><b>${esc(x.k)}</b></td><td class="n"><b>${nf(x.v)}</b></td>
        <td><div style="height:7px;border-radius:4px;background:rgba(120,160,255,.1);overflow:hidden">
          <div style="height:100%;width:${(x.v/mx*100).toFixed(1)}%;border-radius:4px;
            background:linear-gradient(90deg,var(--vi),var(--cy))"></div></div></td>
        <td class="n">${x.n}</td>${meas.rate?`<td class="n">${pct(x.v,x.n)}</td>`:""}</tr>`).join("")}
    </tbody></table></div>`;
  } else {
    h += `<p class="sub" style="margin-top:12px">Add "by channel", "by advisor", "by experience" and so on to break this down.</p>`;
  }
  h += `<button class="askbtn" style="margin-top:14px;font-size:12.5px" onclick="records('${esc(q)}',STASH.AQ)">
    Open the ${rows.length} records</button>`;
  return h;
}
const SUGGEST = ["attendance by channel","enrolments by experience","ready to enrol by advisor",
  "dials by team","unique people by webinar","minutes by advisor","registrations by city",
  "discovery calls by role","enrolments by campaign"];
function askOpen(seed){ ASK = true; AQ = seed || ""; renderAsk(); if(seed) setTimeout(()=>askGo(seed),10) }
function askClose(){ ASK = false; renderAsk() }
function askGo(q){ AQ = q; renderAsk(true) }
function renderAsk(answer){
  let el = $("askPanel");
  if(!ASK){ if(el) el.remove(); $("scrim").classList.remove("on"); return }
  if(!el){
    el = document.createElement("div"); el.id = "askPanel";
    el.style.cssText = `position:fixed;top:8vh;left:50%;transform:translateX(-50%);width:min(880px,94vw);
      max-height:84vh;z-index:150;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;
      background:linear-gradient(160deg,rgba(20,27,48,.99),rgba(10,14,27,.99));
      border:1px solid rgba(34,211,238,.32);box-shadow:0 40px 100px -20px rgba(0,0,0,.95)`;
    el.innerHTML = `<div style="padding:18px 24px 14px;border-bottom:1px solid var(--line)">
        <input id="aIn" placeholder="Ask JARVIS — try &quot;enrolments by experience&quot;"
          style="width:100%;background:none;border:none;color:var(--ink);font:600 19px Inter;outline:none">
        <div class="meta" style="margin-top:5px;font-size:11.5px">Enter to answer · Esc to close ·
          computed from the ${L().length} leads loaded here, nothing leaves this page</div>
      </div><div id="aBody" style="overflow:auto;padding:18px 24px 26px"></div>`;
    document.body.appendChild(el);
    const inp = el.querySelector("#aIn");
    inp.addEventListener("keydown", e => {
      if(e.key === "Enter") askGo(inp.value);
      if(e.key === "Escape") askClose();
    });
    setTimeout(()=>inp.focus(), 40);
  }
  $("scrim").classList.add("on");
  const inp = el.querySelector("#aIn"); if(inp && inp.value !== AQ) inp.value = AQ;
  $("aBody").innerHTML = (answer && AQ.trim())
    ? askRun(AQ)
    : `<div style="display:grid;gap:7px">${SUGGEST.map(s =>
        `<button class="pill" style="cursor:pointer;text-align:left;padding:10px 14px;font-size:13px"
          onclick="askGo('${s}')">${s}</button>`).join("")}</div>`;
  bindCards();
}

/* ============ SHELL ============ */
const TABS = [["core","CORE"],["flow","FLOW"],["agents","AGENTS"],["vault","VAULT"]];
const ICON = {core:"◉", flow:"⇄", agents:"◈", vault:"▤"};
function go(k){ TAB = k; VSEL = null; render(); scrollTo({top:0, behavior:"smooth"}) }

function render(){
  $("brandName").textContent = NAME;
  $("nav").innerHTML = TABS.map(([k,l]) =>
    `<button class="${TAB===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  $("dock").innerHTML = TABS.map(([k,l]) =>
    `<button class="${TAB===k?"on":""}" onclick="go('${k}')">
      <span class="ic">${ICON[k]}</span>${l}</button>`).join("");
  $("fresh").innerHTML = `<span class="chip warn"><i></i>Snapshot · ${L().length} leads</span>`;
  $("lenses").innerHTML = TAB === "flow"
    ? LENSES.map(([k,l]) => `<button class="${LENS===k?"on":""}" onclick="setLens('${k}')">${l}</button>`).join("")
    : "";
  const P = {core:pageCore, flow:pageFlow, agents:pageAgents, vault:pageVault};
  try{
    $("page").innerHTML = (P[TAB] || pageCore)();
  }catch(e){
    $("page").innerHTML = `<h1 class="pg">That view hit an error</h1>
      <p class="sub">${esc(e.message)} — everything else still works.</p>`;
    console.error(TAB, e);
  }
  bindCards();
}

/* hold space (desktop) or long-press (touch) opens Ask */
function bindKeys(){
  let t = null, held = false;
  document.addEventListener("keydown", e => {
    const tag = e.target && e.target.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); askOpen(); return }
    if(e.key === "Escape"){ askClose(); panelClose(); return }
    if(ASK) return;
    if(e.code === "Space" && !t){ held = false; t = setTimeout(() => { held = true; askOpen() }, 900) }
  });
  document.addEventListener("keyup", e => {
    if(e.code === "Space"){ clearTimeout(t); t = null; if(held) e.preventDefault(); held = false }
  });
  let tt = null;
  document.addEventListener("touchstart", e => {
    if(ASK || e.target.closest("button,a,input,.click,.tw")) return;
    tt = setTimeout(() => askOpen(), 900);
  }, {passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev =>
    document.addEventListener(ev, () => clearTimeout(tt), {passive:true}));
}

(async function boot(){
  try{ D = await unzip(JSEED) }
  catch(e){ $("page").innerHTML = `<h1 class="pg">Could not load data</h1><p class="sub">${esc(e.message)}</p>`; return }
  bindKeys();
  render();
})();

</script></body></html>
