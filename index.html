let LIVE_TIMER=null;
function liveLog(s,cls){const l=$("liveLog");if(!l)return;
  l.innerHTML=`<div>${new Date().toLocaleTimeString()} — ${cls?`<${cls}>${s}</${cls}>`:s}</div>`+l.innerHTML}
async function fetchOne(url){
  const res=await fetch(url,{cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const txt=await res.text();
  const t=txt.trim();
  if(t.startsWith("[")||t.startsWith("{")){
    const j=JSON.parse(t);
    return Array.isArray(j)?j:(j.rows||j.data||[]);
  }
  const wb=XLSX.read(t,{type:"string"});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
}
async function fetchLive(){
  const a=$("urlA")?.value.trim(), b=$("urlB")?.value.trim();
  if(!a){liveLog("Enter an analysis URL first.","em");return}
  $("liveStatus").textContent="fetching…";
  try{
    liveLog("Fetching analysis feed…");
    const A=await fetchOne(a);
    let B=null;
    if(b){liveLog("Fetching Live DB feed…");B=await fetchOne(b)}
    liveLog(`Analysis rows: ${A.length}${B?` · Live DB rows: ${B.length}`:""}`,"b");
    await ingest(A,B,"live URL");
    $("liveStatus").textContent="last fetch "+new Date().toLocaleTimeString();
    const m=parseInt($("refMin").value,10);
    if(m>0){clearInterval(LIVE_TIMER);LIVE_TIMER=setInterval(fetchLive,m*60000);
      liveLog(`Auto-refresh every ${m} minutes is on.`,"b")}
  }catch(e){
    liveLog("Fetch failed: "+e.message,"em");
    liveLog("Usually this means the link is not public. A Google 'Publish to web' CSV link works. A normal sheet link that ends in /edit does not.","em");
    $("liveStatus").textContent="failed";
  }
}
function stopLive(){clearInterval(LIVE_TIMER);LIVE_TIMER=null;
  if($("liveStatus"))$("liveStatus").textContent="auto-refresh stopped";liveLog("Auto-refresh stopped.")}

/* ============ INGEST ============ */
function logMsg(s,cls){const l=$("log");if(!l)return;
  l.innerHTML=`<div>${cls?`<${cls}>${s}</${cls}>`:s}</div>`+l.innerHTML}
function parseFile(file){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:"array"});
    const out={};wb.SheetNames.forEach(n=>out[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:""}));
    res(out)}catch(err){rej(err)}};
  fr.onerror=rej;fr.readAsArrayBuffer(file)})}
async function handleFiles(files){
  let analysis=null,db=null;
  for(const f of files){
    logMsg(`Reading ${f.name}…`);
    let sheets;try{sheets=await parseFile(f)}catch(e){logMsg(`Could not read ${f.name}`,"em");continue}
    for(const [name,rows] of Object.entries(sheets)){
      if(!rows.length)continue;
      const keys=Object.keys(rows[0]).map(k=>k.trim().toLowerCase());
      if(keys.includes("hubspot_id")){analysis=rows;logMsg(`Analysis detected — ${rows.length} rows (${f.name} · ${name})`,"b")}
      else if(keys.includes("lead_email")&&(keys.includes("pa_name")||keys.includes("work_ex"))){
        db=rows;logMsg(`Live DB detected — ${rows.length} rows (${f.name} · ${name})`,"b")}}}
  if(!analysis){logMsg("Could not find a sheet with a hubspot_id column. Nothing was loaded.","em");return}
  await ingest(analysis,db,"upload");
}
async function ingest(analysis,db,label){
  const dbMap={};
  if(db)db.forEach(r=>{const k=String(r.lead_email??"").trim();if(k)dbMap[k]=r});
  const DBC=["work_ex","role_domain","Category","Work_Ex_Category","city","channel","alumni_stats",
   "webinar_attended_date","PA_name","POD","first_pa_name","lead_status","latest_classification",
   "total_attempt","total_connect","total_tt","pre_webinar_attempt","pre_webinar_connect",
   "post_webinar_attempt","post_webinar_connect","DCD_Flag","RTE_Flag","course","net_revenue","utm_source"];
  const seen=new Set(),out=[];
  analysis.forEach(raw=>{
    const r={};Object.keys(raw).forEach(k=>r[k.trim()]=raw[k]);
    r.hubspot_id=String(r.hubspot_id??"").trim();
    if(!r.hubspot_id||seen.has(r.hubspot_id))return;seen.add(r.hubspot_id);
    const d=dbMap[r.hubspot_id];
    if(d)DBC.forEach(c=>{if(d[c]!==undefined&&d[c]!=="")r[c]=d[c]});
    r.pa_name_final=S(r.PA_name)||S(r.pa_name_final)||"UNASSIGNED";
    r.pod_final=S(r.POD)||S(r.pod_final)||"UNASSIGNED";
    r.webinar_attended=S(r.webinar_attended_date).trim()?1:(num(r.webinar_attended)||0);
    out.push(score(r))});
  const matched=out.filter(r=>dbMap[r.hubspot_id]).length;
  ROWS=out;
  const L=label==="upload"?logMsg:liveLog;
  L(`Scored ${out.length} leads. ${matched} of them matched to the Live DB (${pct(matched,out.length)}).`,"b");
  if(db&&db.length){
    ALLUNIV=scenarioLayer(buildUniverse(db,new Set(out.map(r=>r.hubspot_id))),out);
    UNIV=ALLUNIV.filter(r=>num(r.is_this_batch)===1);
    const nxt=ALLUNIV.length-UNIV.length;
    if(nxt)L(`${nxt} lead${nxt===1?"":"s"} signed up for a later webinar - counted separately, not in the numbers above.`,"b");
    const ns=UNIV.filter(r=>r.cohort==="NO_SHOW").length;
    const gap=UNIV.filter(r=>r.cohort==="ATTENDED_UNANALYSED").length;
    const dfx=UNIV.filter(r=>num(r.message_defect_count)>0).length;
    L(`${UNIV.length} signed up for this webinar · ${ns} never came · ${gap} came but calls not read.`,"b");
    L(`Every lead put into one of 18 states. ${dfx} of them were told something wrong.`,"b");
  } else L("No Live DB loaded — the advisor, no-show, lead-state and wrong-info pages will be limited.","em");
  $("srcChip").textContent=(label==="upload"?"Loaded · ":"Live · ")+new Date().toLocaleString();
  await saveSnap(true);
  if(label==="upload")go("lead"); else render();
}

/* ============ SNAPSHOTS ============ */
function snapOf(label){
  const A=ROWS,sub=A.filter(r=>r.call_type==="SUBSTANTIVE_CONVERSATION");
  return {label,ts:Date.now(),n:A.length,sub:sub.length,
   cqs:avg(sub.map(r=>r.cqs).filter(v=>v!=null)),
   comp:A.filter(r=>r.framing_flag==="COMPLIANT").length,
   non:A.filter(r=>r.framing_flag==="NON_COMPLIANT").length,
   nourg:A.filter(r=>r.urgency_flag==="NONE").length,
   nonext:A.filter(r=>r.next_step_status==="NOT_DEFINED").length,
   hw:A.filter(r=>["HOT","WARM"].includes(r.temperature)).length}}
async function saveSnap(quiet){
  const label=new Date().toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  SNAPS.unshift(snapOf(label));SNAPS=SNAPS.slice(0,60);
  try{await window.storage.set("fde:snaps",JSON.stringify(SNAPS));
    if(!quiet)logMsg("Checkpoint saved.","b")}catch(e){if(!quiet)logMsg("Could not save a checkpoint here.","em")}
  renderSnapList()}
async function clearSnaps(){SNAPS=[];try{await window.storage.set("fde:snaps","[]")}catch(e){}
  renderSnapList();logMsg("Saved checkpoints cleared.")}
async function loadSnaps(){try{const r=await window.storage.get("fde:snaps");
  if(r&&r.value)SNAPS=JSON.parse(r.value)}catch(e){SNAPS=[]}}
function renderSnapList(){const el=$("snapList");if(!el)return;
  el.innerHTML=SNAPS.length?SNAPS.map(s=>`<div class="snap"><span class="dt">${s.label}</span>
    <span>${s.n} leads · ${s.sub} real calls</span>
    <span style="margin-left:auto;font-weight:700;color:${cqsCol(s.cqs)}">Score ${s.cqs??"—"}</span></div>`).join("")
    :`<div class="mute" style="font-size:12.5px">Nothing saved yet.</div>`}
async function reseed(){await loadSeed();$("srcChip").textContent="Loaded · 29 Jul webinar";
  logMsg("Loaded data restored.","b");render()}

/* ============ EXPORT ============ */
function exportCSV(){
  let rows,name;
  if(TAB==="noshow"&&NSROWS.length){rows=NSROWS;name="noshow_queue"}
  else if(TAB==="scen"&&UNIV.length){rows=UNIV;name="scenario_matrix"}
  else if(TAB==="discipline"&&UNIV.length){rows=UNIV.filter(r=>num(r.message_defect_count)>0);name="told_something_wrong"}
  else if(TAB==="noniql"){rows=NONIQL;name="non_iql_leads"}
  else if(TAB==="upsell"&&window._ES){rows=window._ES;name="existing_students"}
  else if(TAB==="explore"&&window._XR){rows=window._XR;name="explore"}
  else {rows=VIEW;name="analysed_leads"}
  if(!rows.length)return;
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const q=v=>`"${S(v).replace(/"/g,'""')}"`;
  const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>q(r[c])).join(","))).join("\n");
  const b=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download=`FDE_${name}_${new Date().toISOString().slice(0,10)}.csv`;a.click()}

/* ============ SEED + BOOT ============ */
async function gunzipB64(b64){
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const blob=new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(blob).text()}
async function loadSeed(){
  try{
    const j=JSON.parse(await gunzipB64(SEED));
    ROWS=j.rows.map(r=>{const o={};j.cols.forEach((c,i)=>o[c]=r[i]);return score(o)});
    const u=JSON.parse(await gunzipB64(USEED));
    ALLUNIV=u.rows.map(r=>{const o={};u.cols.forEach((c,i)=>o[c]=r[i]);return o});
    UNIV=ALLUNIV.filter(r=>num(r.is_this_batch)===1);
  }catch(e){console.error(e);
    alert("Could not open the built-in data in this browser. Use the Upload page instead.")}}

function render(){
  applyFilters();applyNSFilters();renderNav();
  const P={lead:pageLead,funnel:pageFunnel,explore:pageExplore,plan:pagePlan,scen:pageScen,coach:pageCoach,org:pageOrg,pa:pagePA,discipline:pageDisc,
   voice:pageVoice,queue:pageQueue,noshow:pageNoShow,noniql:pageNonIQL,upsell:pageUpsell,segments:pageSeg,
   leads:pageLeads,trend:pageTrend,upload:pageUpload,data:pageData};
  $("page").innerHTML=P[TAB]();
  if(TAB==="coach"){const el=$("coachIn");if(el&&COACH_Q){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  if(TAB==="upload"){
    renderSnapList();
    const d=$("drop"),f=$("file");
    f.onchange=e=>handleFiles([...e.target.files]);
    ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over")}));
    ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over")}));
    d.addEventListener("drop",e=>handleFiles([...e.dataTransfer.files]));
  }
  window.scrollTo({top:0,behavior:"instant"});
}

(async function init(){
  $("stamp").textContent=new Date().toLocaleDateString([], {day:"2-digit",month:"short",year:"numeric"});
  await loadSeed();await loadSnaps();
