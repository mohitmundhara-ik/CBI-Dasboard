<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDE Command · Interview Kickstart India</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Interview Kickstart palette */
  --navy:#0B2545; --navy-d:#071A33; --navy-l:#123A63;
  --cy:#00A9CE; --cy-d:#00819E; --cy-l:#E6F6FA;
  --ink:#0F1E2E; --body:#3D5266; --mute:#6B8199; --faint:#93A7B8;
  --s0:#FFFFFF; --s50:#F7F9FB; --s100:#EFF3F7; --s200:#E1E8EF; --s300:#C8D4E0;
  --red:#C0392B; --red-l:#FDECEA; --amb:#B9770E; --amb-l:#FEF5E7;
  --grn:#1E8449; --grn-l:#E9F7EF; --vio:#5B4B9E; --vio-l:#F0EDF9;
  --shadow:0 1px 2px rgba(11,37,69,.04), 0 1px 3px rgba(11,37,69,.07);
  --shadow-m:0 4px 12px rgba(11,37,69,.09), 0 1px 3px rgba(11,37,69,.06);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--s50);color:var(--ink)}
body{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;
  font-feature-settings:'cv02','cv03','cv04','cv11';-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
aside.side{width:236px;flex-shrink:0;background:var(--navy);color:#fff;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:16px 16px 13px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo b{font-size:15px;font-weight:800;letter-spacing:-.02em;display:block}
.logo span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:rgba(255,255,255,.5);display:block;margin-top:4px}
.side nav{flex:1;padding:8px 8px;overflow-y:auto}
.side nav .grp{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.35);padding:12px 8px 5px}
.side nav a{display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border-radius:6px;
  color:rgba(255,255,255,.72);font-size:12.5px;font-weight:500;cursor:pointer;
  text-decoration:none;transition:.12s;white-space:nowrap}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.on{background:var(--cy);color:#04222C;font-weight:600}
.side nav a .n{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.55;width:16px}
.side nav a.on .n{opacity:.7}
.side nav a .ct{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.6}
.sidefoot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;
  color:rgba(255,255,255,.45);font-family:'IBM Plex Mono',monospace}

main{flex:1;min-width:0}
.topbar{background:var(--s0);border-bottom:1px solid var(--s200);padding:11px 26px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.wrap{padding:22px 26px 90px;max-width:1720px}
h1.pg{font-size:25px;font-weight:800;letter-spacing:-.028em;margin:3px 0 5px}
p.lede{color:var(--body);font-size:13.5px;max-width:940px;margin-bottom:18px}

/* ---------- controls ---------- */
button,.btn{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;
  background:var(--s0);color:var(--ink);border:1px solid var(--s300);border-radius:7px;
  padding:7px 12px;transition:.12s;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--s100);border-color:var(--mute)}
button.pri{background:var(--cy);border-color:var(--cy);color:#04222C}
button.pri:hover{background:var(--cy-d);border-color:var(--cy-d);color:#fff}
button.gh{background:none;border-color:transparent}
button.gh:hover{background:var(--s100)}
select,input[type=text],input[type=search],input[type=url],input[type=number]{
  background:var(--s0);border:1px solid var(--s300);color:var(--ink);border-radius:7px;
  padding:7px 10px;font-family:Inter,sans-serif;font-size:12.5px}
select:focus,input:focus{outline:2px solid var(--cy-l);border-color:var(--cy)}
label.f{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mute);margin-right:-3px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* ---------- cards ---------- */
.card{background:var(--s0);border:1px solid var(--s200);border-radius:var(--r);
  box-shadow:var(--shadow);padding:17px 18px}
.card h3{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card .sub{font-size:11.5px;color:var(--mute);margin-top:3px;margin-bottom:14px;line-height:1.55}
.grid{display:grid;gap:13px}
section{margin-bottom:8px}

/* ---------- metric card (numbered + defined + drillable) ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.kpi{background:var(--s0);border:1px solid var(--s200);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 15px;position:relative;transition:.13s}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--cy);box-shadow:var(--shadow-m);transform:translateY(-1px)}
.kpi .top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.kpi .id{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:var(--faint);
  letter-spacing:.06em}
.kpi .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.055em;
  color:var(--mute);line-height:1.35;margin-top:4px}
.kpi .val{font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:8px;
  font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi .val em{font-style:normal;font-size:14px;font-weight:600;color:var(--mute);margin-left:4px}
.kpi .den{font-size:11px;color:var(--mute);margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .arrow{color:var(--s300);font-size:13px;line-height:1}
.kpi.click:hover .arrow{color:var(--cy)}
.kpi.r{border-top:2px solid var(--red)} .kpi.w{border-top:2px solid var(--amb)}
.kpi.g{border-top:2px solid var(--grn)} .kpi.a{border-top:2px solid var(--cy)}
.info{display:inline-flex;width:13px;height:13px;border-radius:50%;border:1px solid var(--s300);
  color:var(--faint);font-size:9px;align-items:center;justify-content:center;cursor:help;
  position:relative;font-weight:700;flex-shrink:0;font-family:Inter}
.info:hover{border-color:var(--navy);color:var(--navy)}
.info .tip{visibility:hidden;opacity:0;transition:.14s;position:absolute;left:50%;
  transform:translateX(-50%);bottom:calc(100% + 7px);z-index:80;width:280px;padding:10px 12px;
  border-radius:8px;background:var(--navy);color:#fff;font-size:11px;line-height:1.55;
  font-weight:400;text-transform:none;letter-spacing:0;box-shadow:var(--shadow-m);pointer-events:none;text-align:left}
.info:hover .tip{visibility:visible;opacity:1}
.info .tip b{color:var(--cy);font-weight:600}

/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--s200);border-radius:var(--r);background:var(--s0);
  box-shadow:var(--shadow);max-height:660px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--s100);z-index:5;text-align:left;padding:9px 11px;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--body);border-bottom:1px solid var(--s200);cursor:pointer;white-space:nowrap;font-weight:600}
th:hover{color:var(--cy-d)}
td{padding:9px 11px;border-bottom:1px solid var(--s100);vertical-align:top}
tbody tr:hover{background:var(--cy-l)}
tbody tr.click{cursor:pointer}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:2.5px 7px;border-radius:20px;
  background:var(--s100);color:var(--body);white-space:nowrap;margin:1px 2px 1px 0;letter-spacing:.01em}
.pill.mono{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.02em}
.pill.hot{background:var(--red-l);color:var(--red)}
.pill.warm{background:var(--amb-l);color:var(--amb)}
.pill.good{background:var(--grn-l);color:var(--grn)}
.pill.cool{background:var(--cy-l);color:var(--cy-d)}
.pill.vio{background:var(--vio-l);color:var(--vio)}

/* ---------- bars ---------- */
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px;
  padding:2px 0;border-radius:5px}
.hbar.click{cursor:pointer}
.hbar.click:hover{background:var(--s50)}
.hbar .nm{width:200px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:17px;background:var(--s100);border-radius:4px;overflow:hidden;min-width:60px}
.hbar .tr i{display:block;height:100%;border-radius:4px;background:var(--cy)}
.hbar .vn{width:96px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;
  font-variant-numeric:tabular-nums;flex-shrink:0}
.bar{height:5px;background:var(--s100);border-radius:3px;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:3px}

/* ---------- funnel ---------- */
.fn{display:flex;flex-direction:column;gap:5px}
.fnrow{display:flex;align-items:center;gap:11px;cursor:pointer;padding:2px 0;border-radius:5px}
.fnrow:hover{background:var(--s50)}
.fnrow .st{width:26px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);flex-shrink:0}
.fnrow .lb{width:236px;font-size:12.5px;flex-shrink:0;display:flex;align-items:center;gap:6px}
.fnrow .bx{flex:1;position:relative;height:29px;background:var(--s100);border-radius:5px;overflow:hidden;min-width:80px}
.fnrow .bx i{display:block;height:100%;background:linear-gradient(90deg,var(--cy-d),var(--cy));border-radius:5px}
.fnrow .bx span{position:absolute;left:9px;top:0;height:29px;display:flex;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.25)}
.fnrow .dl{width:132px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--mute);flex-shrink:0;font-variant-numeric:tabular-nums}

/* ---------- callout ---------- */
.callout{border:1px solid var(--s200);border-left:3px solid var(--red);border-radius:var(--r);
  padding:15px 17px;background:var(--s0);box-shadow:var(--shadow);margin-bottom:16px}
.callout.ok{border-left-color:var(--grn)}
.callout.info{border-left-color:var(--cy)}
.callout h4{font-size:15px;font-weight:700;margin-bottom:5px;letter-spacing:-.015em}
.callout p{font-size:12.5px;color:var(--body);line-height:1.65}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,37,69,.4);backdrop-filter:blur(3px);
  z-index:90;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1020px,97vw);background:var(--s50);
  z-index:95;transform:translateX(101%);transition:.24s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(11,37,69,.18)}
.drawer.on{transform:translateX(0)}
.dhead{background:var(--s0);border-bottom:1px solid var(--s200);padding:13px 22px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-shrink:0}
.dhead h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.dhead .ctx{font-size:11.5px;color:var(--mute);margin-top:3px}
.dbody{overflow-y:auto;padding:20px 22px 60px;flex:1}
.vb{background:var(--s0);border:1px solid var(--s200);border-left:2px solid var(--cy);
  border-radius:8px;padding:12px 14px;margin:6px 0 15px;font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;color:var(--body);max-height:330px;overflow:auto}
.vb.empty{color:var(--faint);font-style:italic;border-left-color:var(--s300)}
.fl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cy-d);margin-top:17px;font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:9px;margin:13px 0 6px}
.meta div{background:var(--s0);border:1px solid var(--s200);border-radius:8px;padding:9px 11px}
.meta .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--mute);
  text-transform:uppercase;margin-bottom:3px}
.meta .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- misc ---------- */
.drop{border:1.5px dashed var(--s300);border-radius:var(--r);padding:30px;text-align:center;
  background:var(--s0);transition:.13s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--cy);background:var(--cy-l)}
.log{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--body);margin-top:12px;
  max-height:200px;overflow:auto;line-height:1.75}
.log b{color:var(--grn)} .log em{color:var(--red);font-style:normal}
.snap{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--s200);
  border-radius:8px;background:var(--s0);margin-bottom:6px;font-size:12.5px}
.snap .dt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cy-d);width:160px}
.step{background:var(--s0);border:1px solid var(--s200);border-left:3px solid var(--cy);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-top:11px;display:flex;gap:15px}
.step .no{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;color:var(--s300);
  width:34px;flex-shrink:0;line-height:1.1}
.askbar{display:flex;gap:9px;margin:4px 0 14px}
.askbar input{flex:1;max-width:680px;font-size:14.5px;padding:11px 14px;border-radius:9px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:12px;padding:6px 11px;border-radius:20px;background:var(--s0);border:1px solid var(--s200);
  cursor:pointer;color:var(--body);transition:.12s}
.chip:hover{border-color:var(--cy);color:var(--cy-d);background:var(--cy-l)}
.ans{background:var(--s0);border:1px solid var(--s200);border-left:3px solid var(--cy);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.anshead{padding:13px 18px;border-bottom:1px solid var(--s100);background:var(--s50);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.ansbody{padding:15px 18px;font-size:13.5px;color:var(--body);line-height:1.75}
.ansbody p{margin-bottom:11px} .ansbody p:last-child{margin-bottom:0}
.ansbody b{color:var(--ink)}
.ansbody ul,.ansbody ol{margin:0 0 11px 20px} .ansbody li{margin-bottom:5px}
.ansbody .evi{font-size:11.5px;color:var(--mute);border-top:1px dashed var(--s200);padding-top:9px;margin-top:11px}
.ansbody .warn{background:var(--red-l);border-radius:7px;padding:10px 13px;color:var(--red);font-size:12.5px}
.ansbody .warn b{color:var(--red)}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:11px}
table.mini th{position:static;background:var(--s100);padding:7px 10px;font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;border-bottom:1px solid var(--s200);cursor:default}
table.mini td{padding:7px 10px;border-bottom:1px solid var(--s100)}
table.mini td:first-child{color:var(--mute);width:150px}
.qlink{font-size:12.5px;color:var(--body);padding:7px 0;border-bottom:1px solid var(--s100);cursor:pointer;line-height:1.45}
.qlink:hover{color:var(--cy-d)}
.xbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--s0);
  border:1px solid var(--s200);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 14px;margin-bottom:14px;
  position:sticky;top:49px;z-index:20}
.xcount{font-size:15px;flex-shrink:0;font-variant-numeric:tabular-nums}
.xcount b{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.03em}
.xchips{flex:1;display:flex;gap:6px;flex-wrap:wrap;min-width:150px}
.xchip{font-size:11.5px;padding:5px 9px;border-radius:20px;background:var(--cy-l);color:var(--cy-d);
  border:1px solid var(--cy);display:inline-flex;align-items:center;gap:7px}
.xchip b{color:var(--navy)}
.xchip i{font-style:normal;cursor:pointer;opacity:.55;font-size:11px}
.xchip i:hover{opacity:1;color:var(--red)}
.xgroup{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--mute);margin:22px 0 9px;font-weight:600}
.xgrid{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.xpanel{padding:14px 15px}
.xpanel h3{font-size:12.5px}
.xpanel .sub{margin-bottom:11px;font-size:11px}
.xpanel .hbar{margin-bottom:5px;padding:3px 5px;border-radius:5px}
.xpanel .hbar .nm{width:132px;font-size:12px}
.xpanel .hbar .vn{width:82px;font-size:10.5px}
.hbar.xon{background:var(--cy-l);font-weight:600}
.hbar.xon .nm{color:var(--navy)}
.dfc{background:var(--s0);border:1px solid var(--s200);border-left:3px solid var(--red);
  border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.dfhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;
  background:var(--s50);border-bottom:1px solid var(--s100);font-size:12.5px}
.dfrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 14px;
  border-bottom:1px solid var(--s100);font-size:12.5px}
.dfk{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mute);margin-right:3px}
.dfsep{font-size:11.5px;color:var(--mute);margin:0 3px}
.dfq{padding:11px 14px;border-bottom:1px solid var(--s100)}
.dfq:last-child{border-bottom:none}
.dfqh{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-bottom:6px}
.dfqh b{color:var(--red)}
.dfqt{font-size:13px;line-height:1.72;color:var(--body);background:var(--s50);border-radius:7px;
  padding:11px 13px;border-left:2px solid var(--s300)}
.dfq.empty .dfqt{color:var(--faint);font-style:italic;font-size:12px}
mark{background:#FFE79B;color:var(--ink);font-weight:700;padding:1px 3px;border-radius:3px}
.orgwrap{display:flex;flex-direction:column;gap:8px}
.orgrow{display:flex;gap:14px;align-items:stretch;background:var(--s0);border:1px solid var(--s200);
  border-radius:var(--r);box-shadow:var(--shadow);padding:13px 15px;cursor:pointer;transition:.13s}
.orgrow:hover{border-color:var(--cy);box-shadow:var(--shadow-m)}
.orgrow.on{border-color:var(--navy);box-shadow:var(--shadow-m)}
.orgcode{width:44px;flex-shrink:0;border-radius:7px;color:#fff;font-family:'IBM Plex Mono',monospace;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.orgmain{flex:1;min-width:0}
.orgtitle{font-size:14.5px;font-weight:700;letter-spacing:-.015em;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.orgdesc{font-size:12.5px;color:var(--body);line-height:1.6;margin-top:5px}
.orgtitles{margin-top:7px}
.orgadds{margin-top:8px;font-size:12px;color:var(--cy-d);background:var(--cy-l);
  padding:7px 10px;border-radius:6px;display:inline-block}
.orgadds b{color:var(--navy)}
.orgbar{width:170px;flex-shrink:0;position:relative;background:var(--s100);border-radius:6px;
  overflow:hidden;align-self:stretch;min-height:52px}
.orgbar i{display:block;height:100%;border-radius:6px}
.orgbar span{position:absolute;left:10px;top:50%;transform:translateY(-50%);

const SCMETA=[{"code":"S01_WON_ENROLLED","meaning":"Already enrolled.","why":"It worked.","play":"Hand over to the course team. Save the call recording as a good example for training.","owner":"Program ops","sla":"Within 48h"},{"code":"S02_DISQUALIFIED","meaning":"Junk, duplicate or dead record.","why":"Bad form data, or never a real person.","play":"Stop calling. Fix the form or CRM so these stop coming through.","owner":"RevOps","sla":"Weekly hygiene"},{"code":"S03_LOST_NOT_INTERESTED","meaning":"Said no.","why":"Real no - price, fit or timing. Or a bad call that closed the door too early.","play":"Do not call again. Note the reason. But check any 'no' that came after a call scoring under 40 - the problem may be the call, not the lead.","owner":"Sales manager","sla":"Weekly review"},{"code":"S04_GATEKEEPER","meaning":"We spoke to someone else, not the lead.","why":"Someone signed up using a partner's or colleague's number.","play":"Get the real number, save it, and start again with the actual person.","owner":"Owning PA","sla":"24h"},{"code":"S05_NOSHOW_NEVER_TOUCHED","meaning":"Did not come. Never called once.","why":"The lead came in outside calling hours or was never given to anyone.","play":"Treat as a brand new lead. Full first call. Use the recording as your reason to ring.","owner":"Owning PA","sla":"48h"},{"code":"S06_NOSHOW_UNDER_WORKED","meaning":"Did not come. Called 1-3 times, never picked up.","why":"We stopped calling too early.","play":"Keep calling. Try early morning or after 8pm before giving up.","owner":"Owning PA","sla":"72h"},{"code":"S07_NOSHOW_UNREACHABLE","meaning":"Did not come. Called 4+ times, never picked up.","why":"Wrong number or screening calls. More calls will not help.","play":"Stop calling. Send the recording on WhatsApp with one line about India demand, then one call 48 hours later at a different time.","owner":"Owning PA","sla":"This week"},{"code":"S08_NOSHOW_ENGAGED","meaning":"Did not come, but talked to us for 5+ minutes first.","why":"Not a lack of interest. Something about timing or trust changed after the call.","play":"Best call in this group. Ring within 24 hours, open with what they missed, offer a 1-to-1 instead of another webinar.","owner":"Owning PA","sla":"24h"},{"code":"S09_NOSHOW_BRIEF_CONTACT","meaning":"Did not come. Picked up but spoke for under 5 minutes.","why":"The call was too short to learn anything.","play":"Start again properly. Ask the basic questions, then decide whether to invite again or park them.","owner":"Owning PA","sla":"72h"},{"code":"S10_ATTENDED_NEVER_WORKED","meaning":"Came to the webinar, nobody has called since.","why":"The follow-up list was not worked.","play":"Call now. Attending is the strongest signal we get and it fades fast.","owner":"Owning PA","sla":"24h"},{"code":"S11_ATTENDED_NOT_ANALYSED","meaning":"Came and was called, but nobody has read those calls.","why":"They were not in the batch that went through the call-reading prompt.","play":"Include them in the next batch, then load the file in. Until then they are invisible to every score.","owner":"Category owner","sla":"Next batch"},{"code":"S12_REMINDER_ONLY","meaning":"Came, but every call so far was just a reminder.","why":"The pitch has not happened yet. Nothing has gone wrong.","play":"Book a proper first call. Do not open with price. Explain the role, the India demand, then how it fits them.","owner":"Owning PA","sla":"48h"},{"code":"S13_WRONG_PROGRAM_PITCHED","meaning":"A real call happened but it was about a different course.","why":"The advisor moved to a course they know better, or thought FDE was a bad fit.","play":"Decide on purpose. If the switch was right, move them out of FDE so the numbers stay clean. If not, pitch FDE properly.","owner":"Sales manager","sla":"72h"},{"code":"S14_BAD_PITCH_LIVE_LEAD","meaning":"Warm lead who got a weak call.","why":"The interest was real, the call was not. Money you can get back.","play":"Call again within 48 hours, ideally with a manager or a different advisor. Start by saying the first call did not cover everything.","owner":"Sales manager","sla":"48h"},{"code":"S15_GOOD_PITCH_OPEN_LOOP","meaning":"Decent call, but something was promised and not done.","why":"There is momentum and it will fade without a chase.","play":"Chase the exact thing promised. Never a general follow-up.","owner":"Owning PA","sla":"24h"},{"code":"S16_GOOD_PITCH_NO_NEXT_STEP","meaning":"Decent call that ended with nothing agreed.","why":"The advisor explained things but never asked for a next step.","play":"Call back and fix a date. Coach the advisor to close every call with a diary entry.","owner":"Owning PA","sla":"48h"},{"code":"S17_NURTURE","meaning":"Real interest, but not in a hurry.","why":"Genuine but slow. Calling hard here takes time away from hot leads.","play":"Move to a weekly nurture sequence. Content, not pitch.","owner":"CRM / lifecycle","sla":"Weekly"},{"code":"S19_EXISTING_STUDENT","meaning":"Already an IK student, and came back for the FDE webinar.","why":"They bought from IK once and re-registered for this. That is interest, not a closed deal.","play":"Treat as an upsell, not a write-off. Ask what they are trying to do next, then pitch FDE or whichever IK course actually fits. Alumni pricing applies - use the approved alumni rule, never a number you make up on the call.","owner":"Owning PA","sla":"48h"},{"code":"S18_LOW_PRIORITY","meaning":"Called, low signal, no clear reason to drop them.","why":"Neither hot nor a definite no.","play":"Park them. Re-check after the next webinar instead of calling now.","owner":"CRM / lifecycle","sla":"Next cohort"}];
const PLAN=[{"blk":"A","block":"Stop the damage","action":"Stop quoting prices until one price and one discount rule are written down and shared.","why":"We quoted 28 different prices to this batch, from Rs 1,35,000 to Rs 3,99,000. If a person hears one price from one advisor and another price from someone else, they stop trusting both. This is also how refund fights start.","ev":"See the 'Wrong info given' tab","owner":"Category owner + Swati","when":"Today","verify":"'Price does not match' drops to zero the next time you load data."},{"blk":"A","block":"Stop the damage","action":"Put one page in front of the team: exact course name, 23 weeks, one price, discount rule, tools, projects, who it is for. Have every advisor read it out loud once.","why":"Advisors called the course FD, FTE, FBE, FDA, NFDI and Power Deployment Engineer. They said '6 months' 34 times when the brochure says 23 weeks. You cannot build a new category if your own team cannot say its name.","ev":"See the 'Wrong info given' tab","owner":"Category owner","when":"In 2 days","verify":"'Wrong course name' and 'Wrong length' both drop to zero."},{"blk":"A","block":"Stop the damage","action":"Call every lead marked S08 - they talked to us for 5+ minutes and still did not come to the webinar. Open with what they missed and offer a 1-to-1 instead of another webinar.","why":"These people gave an advisor five minutes or more and then did not show up. That is not a lack of interest, it is a timing or trust problem. Easiest calls in the whole file.","ev":"See the 'Lead states' tab, row S08","owner":"Their advisor","when":"In 1 day","verify":"The S08 count goes down and those calls start appearing as scored calls."},{"blk":"A","block":"Stop the damage","action":"Call every lead marked S10 - they sat through the whole webinar and nobody has called them since.","why":"Coming to the webinar is the strongest buying signal we have, and it fades in a few days. Right now these people are being ignored.","ev":"See the 'Lead states' tab, row S10","owner":"Their advisor","when":"In 1 day","verify":"The S10 count goes to zero."},{"blk":"A","block":"Stop the damage","action":"Call every lead marked S14 again, with a manager on the line. Start by saying the first call did not cover everything.","why":"These are warm leads whose call scored under 45. The interest was real, the call was not. This is money you can get back without spending anything on marketing.","ev":"See the 'Lead states' tab, row S14","owner":"Sales manager","when":"In 2 days","verify":"Their call score goes above 55 next time you read their calls."},{"blk":"B","block":"Finish what we started","action":"Work through the 'Promises to chase' tab. Chase the exact thing promised - the CV, the brochure, the curriculum. Never send a general 'just following up' message.","why":"Promises are open on both sides and the CRM does not track any of them. Breaking a small promise is the cheapest way to lose a lead you already warmed up.","ev":"See the 'Promises to chase' tab","owner":"Their advisor","when":"This week","verify":"The tab empties out."},{"blk":"B","block":"Finish what we started","action":"Call every lead marked S16 back and fix a date and time before hanging up.","why":"The advisor explained things well and then let the call end with nothing agreed. That is a call you have to pay for twice.","ev":"See the 'Lead states' tab, row S16","owner":"Their advisor","when":"In 2 days","verify":"More calls show 'next step agreed' and fewer show 'nothing agreed'."},{"blk":"B","block":"Finish what we started","action":"Book a proper first call with every lead marked S12. Do not open with the price.","why":"These people came to the webinar and have only ever had reminder calls. Nothing has gone wrong yet, so there is nothing to undo. Cleanest leads you have.","ev":"See the 'Lead states' tab, row S12","owner":"Their advisor","when":"This week","verify":"They move out of S12 and get a call score."},{"blk":"B","block":"Finish what we started","action":"Run the leads marked S11 through the call-reading prompt in the next batch and load them in.","why":"They came and were called, but nobody has read those calls. So they do not show up in any score or advisor report.","ev":"See the 'Lead states' tab, row S11","owner":"Category owner","when":"Next batch","verify":"Every person who attended has had their calls read."},{"blk":"B","block":"Finish what we started","action":"Decide what to do with the leads marked S13 - either move them out of FDE or pitch FDE again properly.","why":"A real call happened but it drifted to a different course. Left alone, these leads make FDE numbers look wrong and you will misread how the category is doing.","ev":"See the 'Lead states' tab, row S13","owner":"Sales manager","when":"In 3 days","verify":"S13 goes to zero."},{"blk":"C","block":"Fix the system","action":"Write three approved reasons to join now - batch start date, limited seats, and the India hiring window - and make advisors use one on every call.","why":"Not a single call gave a real reason to join now. 27 gave a half-reason and 49 gave none. Without a reason to act today, a high price is just a reason to think about it.","ev":"See the Summary tab","owner":"Category owner + Swati","when":"This week","verify":"'Gave a reason to join now' stops being zero and goes up every week."},{"blk":"C","block":"Fix the system","action":"Make 'agree a next step' a rule for every call. No call counts as finished without a date in the calendar.","why":"40 calls ended with nothing agreed. That is the step that turns interest into money, and it is the one being skipped most.","ev":"See the Summary tab, step-by-step","owner":"Sales manager","when":"This week","verify":"The gap between real calls and calls with a next step gets smaller each time."},{"blk":"C","block":"Fix the system","action":"Before pitching FDE to a manager or PM, check they have actually written code in the last 12 months.","why":"A big chunk of our leads are managers and PMs. Our own FDE scorecard says this is a hands-on coding role and these profiles need to get back into coding first. Selling past that gets you refunds, not revenue.","ev":"See the 'Lead states' tab, fit section","owner":"Sales manager","when":"This week","verify":"These leads either pass the check or get moved to a better-fit IK course."},{"blk":"C","block":"Fix the system","action":"Fix the 'post_webinar_attempt' field. It is linked to the attendance timestamp, so it shows zero for every no-show even when we did call them.","why":"Any dashboard built on that field will always say no-show follow-up is zero, and you will think a queue is being worked when it is not.","ev":"See the Summary tab, CRM check","owner":"RevOps","when":"This week","verify":"No-show follow-up numbers stop showing zero when calls have been made."},{"blk":"C","block":"Fix the system","action":"Talk to Talent 500 about how many people actually attend, not how many sign up.","why":"Talent 500 sends the most people who register and never turn up. Sign-ups there are cheap, but attendance is what sales actually needs.","ev":"See the 'No shows' tab, by channel","owner":"Category owner","when":"This week","verify":"Talent 500 attendance goes up at the next webinar."},{"blk":"D","block":"Check it is working","action":"Load the call file and the lead DB into the tool after every batch of calls. At least once a day.","why":"Every number here is one snapshot in time. Without a second snapshot you cannot tell if the coaching worked or the leads just got easier.","ev":"Tool: 'Day-on-day' tab","owner":"Category owner","when":"Every day","verify":"The day-on-day chart shows the call score going up."},{"blk":"D","block":"Check it is working","action":"Look at four numbers in every weekly review: average call score, FDE explained correctly, reason to join now, and next step agreed.","why":"These four move within days. Enrolments will tell you nothing useful for weeks on a batch this new.","ev":"Summary tab","owner":"Category owner","when":"Every week","verify":"All four go up week on week. If they do not, the coaching is not working."}];

function gradeText(t){t=S(t);if(!t.trim())return[-1,NAV];if(NA.test(t.slice(0,120)))return[-1,NAV];
  const h=t.slice(0,160).toUpperCase();
  for(const[sc,ws]of GRADE_LEX)for(const w of ws)if(h.includes(w))return[sc,GL[sc]];
  return[2,"MODERATE"];}
function framing(t){t=S(t);if(!t.trim()||NA.test(t.slice(0,120)))return[NAV,0,-1];
  const u=t.toUpperCase();const gap=u.includes("CONFIDENCE_GAP")?1:0;let f,s;
  if(u.includes("NON_COMPLIANCE_FRAMING")){f="NON_COMPLIANT";s=0}
  else if(u.slice(0,80).includes("PARTIAL")){f="PARTIAL";s=2}
  else if(u.includes("COMPLIANCE_FRAMING")){f="COMPLIANT";s=4}
  else if(gap){f="CONFIDENCE_GAP_ONLY";s=1}else{f="UNCLASSIFIED";s=2}
  if(gap&&s>0)s=Math.max(0,s-1);return[f,gap,s];}
function urgency(t){t=S(t);if(!t.trim()||NA.test(t.slice(0,120)))return[NAV,-1];
  const u=t.toUpperCase();
  if(u.includes("NO_URGENCY_CREATED"))return["NONE",0];
  if(u.includes("PARTIAL_URGENCY"))return["PARTIAL",2];
  if(u.includes("URGENCY_CREATED"))return["CREATED",4];

function interest(sig,ev){const t=S(sig)+" "+S(ev);
  if(!t.trim()||NA.test(t.slice(0,140)))return[NAV,-1];const h=t.slice(0,400);
  if(/\b(no interest|not interested|none|absent|did not express|no explicit)\b/i.test(h))return["NONE",0];
  if(/\b(weak|low|exploratory|limited interest|passive|lukewarm)\b/i.test(h))return["WEAK",1];
  if(/\b(yes|explicit|strong|high|clear intent|actively|committed)\b/i.test(h))return["STRONG",4];
  if(/\b(moderate|conditional|deferred|indirect|some interest|potential|exploring|curious)\b/i.test(h))return["MODERATE",2];

function score(r){
  const [ds,dg]=gradeText(r.profile_discovery_quality);
  const [ps,pg]=gradeText(r.probing_and_mapping_quality);
  const [ff,cg,fs]=framing(r.pa_fde_introduction_assessment);
  const [uf,us]=urgency(r.urgency_creation_assessment);
  const [il,isc]=interest(r.fde_interest_signal,r.fde_interest_evidence);
  r.discovery_score=ds;r.discovery_grade=dg;r.probing_score=ps;r.probing_grade=pg;
  r.framing_flag=ff;r.confidence_gap=cg;r.framing_score=fs;
  r.urgency_flag=uf;r.urgency_score=us;r.interest_level=il;r.interest_score=isc;
  r.objection_themes=tagIt(S(r.lead_objections)+" "+S(r.objections_evidence),OBJ);
  r.pain_themes=tagIt(S(r.lead_pain_points)+" "+S(r.pain_points_evidence),PAIN);
  r.details_shared_tags=tagIt(r.program_details_shared,DET);
  r.details_shared_count=r.details_shared_tags?r.details_shared_tags.split(";").length:0;
  r.objection_count=r.objection_themes?r.objection_themes.split(";").length:0;
  r.next_step_status=nextStep(r.stop_context,r.last_call_outcome);
  // CQS
  if(r.call_type!=="SUBSTANTIVE_CONVERSATION"){r.cqs=null}
  else{let nu=0,de=0;[["discovery_score",25],["probing_score",25],["framing_score",30],["urgency_score",20]]
    .forEach(([k,ww])=>{if(r[k]>=0){nu+=r[k]*ww;de+=ww}});
    r.cqs=de?Math.round(nu*100/(4*de)*10)/10:null;}
  r.cqs_band=r.cqs==null?"":(r.cqs<30?"CRITICAL (<30)":r.cqs<50?"POOR (30-50)":r.cqs<70?"FAIR (50-70)":"GOOD (70+)");
  // priority
  let s=CLASS_PTS[S(r.latest_classification)]??8;
  s+=STATUS_PTS[S(r.lead_status)]??6;
  if(r.interest_score>=0)s+=r.interest_score*4;
  if(num(r.webinar_attended)===1)s+=10;
  s+=Math.min(9,num(r.total_tt)/5*3);
  if(r.call_type==="WEBINAR_REMINDER_ONLY")s+=4;
  const st=S(r.lead_status);
  if(st.startsWith("Not interested")||st==="Junk"||st==="Enrolled")s=Math.min(s,15);
  r.lead_priority_score=Math.round(Math.min(100,s)*10)/10;
  const p=r.lead_priority_score;
  r.temperature=p>=70?"HOT":p>=52?"WARM":p>=36?"COOL":p>=20?"COLD":"DEAD";
  // action
  r.action_bucket=(()=>{
    if(st==="Enrolled")return"WON";
    if(st.startsWith("Not interested")||st==="Junk")return"DISQUALIFY";
    if(r.call_type==="NO_CALLS_IN_SCOPE")return"NEVER_CONTACTED";
    if(r.call_type==="WEBINAR_REMINDER_ONLY")return"AWAITING_FIRST_PITCH";
    if(["HOT","WARM"].includes(r.temperature)&&r.cqs!=null&&r.cqs<45)return"RE_PITCH_FDE";
    if(["HOT","WARM"].includes(r.temperature))return"CALL_NOW";
    if(r.temperature==="COOL")return"NURTURE";
    return"LOW_PRIORITY";})();
  const f=[];
  if(ff==="NON_COMPLIANT")f.push("NO_FDE_FRAMING");
  if(cg===1)f.push("PA_CONFIDENCE_GAP");
  if(uf==="NONE")f.push("NO_URGENCY");
  if(r.next_step_status==="NOT_DEFINED")f.push("NO_NEXT_STEP");
  if(ds===0||ds===1)f.push("WEAK_DISCOVERY");
  if(ps===0||ps===1)f.push("WEAK_PROBING");
  if(["HOT","WARM"].includes(r.temperature)&&r.cqs!=null&&r.cqs<45)f.push("HOT_LEAD_BAD_CALL");
  if(num(r.total_attempt)>=5&&num(r.total_connect)===0)f.push("HIGH_ATTEMPT_NO_CONNECT");

    r.pa_name_final=S(r.PA_name)||"UNASSIGNED";
    r.pod_final=S(r.POD)||"UNASSIGNED";

const FIT_CORE=new Set(["Back-end","Full Stack","Front-end","Other Software Engineers","Machine Learning / AI",
 "Data Engineer","Cloud Engineer","SRE / DevOps","DevOps Engineer","Site Reliability Engineer",
 "Android Developer","iOS Developer"," Embedded Software Engineer"]);
const FIT_ADJ=new Set(["Data Science","Test Engineer / SDET / QE","Cyber Security","Data Analyst / Business Analyst"]);
const FIT_STR=new Set(["Engineering Manager - any domain","Technical Program Manager","Tech Product Manager","Product Manager (Tech)"]);
const CANON_WEEKS=23, CANON_PRICE=275000;
const PRICE_RE=/(?:₹|Rs\.?|INR)\s?([\d,]{3,12})|\b(\d(?:\.\d+)?)\s*(?:lakh|lakhs|lacs|L)\b/gi;
const DUR_RE=/\b(\d{1,2})\s*[-\s]*(month|months|week|weeks)\b/gi;
const NAME_BAD=/\b(FDA|FBE|FTE|NFDI|Power Deploy\w*|Forward Deployment)\b/g;
const NOT_DURATION=/(emi|instal?ment|payment|loan|tenure|financ|notice period|experience|years? of|validity|access|warrant|subscription|refund|guarantee|delay|within the next|from now|by then|placement|joining|switch|target)/i;
const IS_DURATION=/(program|programme|course|batch|cohort|curriculum|class|session|module|duration|long|track|training|it is|it's|spans?|comprise|last)/i;
const LEAD_SAID=/(lead|prospect|customer|he|she|they)\s+(said|says|asked|calls?|referred|misunder|thinks?|mentioned)|misunder|mishear|lead:|prospect:|speaker prospect/i;
const PA_SAID=/(pa|advisor|sales rep|counsel?l?or)\s*[:\-]|pa said|pa stated|pa referred/i;
function paAttributed(t,start,end){
  const before=t.slice(Math.max(0,start-220),start), after=t.slice(end,end+80);
  if(/misunder|mishear/i.test(before+after))return false;
  const li=Math.max(before.lastIndexOf("lead"),before.lastIndexOf("Lead"),
                    before.lastIndexOf("prospect"),before.lastIndexOf("Prospect"),
                    before.lastIndexOf("customer said"));
  const pi=Math.max(before.lastIndexOf("PA:"),before.lastIndexOf("PA "),
                    before.lastIndexOf("advisor"),before.lastIndexOf("Advisor"),
                    before.lastIndexOf("Sales Rep"),before.lastIndexOf("sales rep"));
  if(li>pi)return false;
  if(LEAD_SAID.test(before)&&!PA_SAID.test(before.slice(-90)))return false;
  return true;}
const OTHER_PROG=/(TPM|Technical Program Manager|Generative AI program|GenAI program|ML Flagship|Machine Learning Flagship|support extension|alumni bundle|Interview Lab|Full Stack EdgeUp|Data Engineering program|System Design program|DSA program)/i;
const DRIFT_RE=/(only in pre-?webinar|not sustained|mentioned briefly|discussed only|shifted entirely|instead of FDE|interested in TPM|not FDE)/i;
const GATE_RE=/\b(wife|husband|spouse|registered (it )?for (my|his|her)|not the (right )?person|autofill)\b/i;
const COMMITS=[["RESUME_FROM_LEAD",/\bresume\b/i,"LEAD"],["BROCHURE_FROM_PA",/\bbrochure\b/i,"PA"],
 ["CURRICULUM_FROM_PA",/\bcurricul/i,"PA"],
 ["CALLBACK_FROM_PA",/\b(call ?back|re-?schedul|connect (after|later)|talk later|schedule (a |the )?call)/i,"PA"],
 ["PAYMENT_FROM_LEAD",/\bpayment link|complete the payment/i,"LEAD"],
 ["WHATSAPP_FROM_PA",/\bwhatsapp\b/i,"PA"],
 ["MANAGER_INTRO_FROM_PA",/\bvertical manager|program manager|senior manager/i,"PA"]];
function xPrices(t){const out=new Set();let m;PRICE_RE.lastIndex=0;
  while((m=PRICE_RE.exec(t||""))!==null){let v=m[1]?parseInt(m[1].replace(/,/g,""),10):Math.round(parseFloat(m[2])*100000);
    if(v>=20000&&v<=1000000)out.add(v)}return [...out].sort((a,b)=>a-b)}
function xDurs(t){t=t||"";const out=new Set();let m;DUR_RE.lastIndex=0;
  while((m=DUR_RE.exec(t))!==null){const n=parseInt(m[1],10);
    const wk=Math.round(m[2].toLowerCase().startsWith("month")?n*4.345:n);
    if(wk<4||wk>60)continue;
    const ctx=t.slice(Math.max(0,m.index-90),m.index+m[0].length+90);
    if(NOT_DURATION.test(ctx)||!IS_DURATION.test(ctx))continue;
    out.add(wk)}return [...out].sort((a,b)=>a-b)}
function scenarioLayer(univ, analysed){
  const A={}; analysed.forEach(r=>A[String(r.hubspot_id)]=r);
  univ.forEach(r=>{
    const d=S(r.role_domain), wx=S(r.work_ex);
    let base=FIT_CORE.has(d)?"CORE":FIT_ADJ.has(d)?"ADJACENT":FIT_STR.has(d)?"STRETCH":"UNKNOWN";
    r.fde_fit=(base==="CORE"||base==="ADJACENT")&&wx==="20+"?base+"_SENIOR":base;
    const a=A[String(r.hubspot_id)]||{};
    const blob=[a.program_details_shared,a.pa_fde_introduction_verbatim,a.urgency_creation_verbatim,
                a.complete_conversation_narrative,a.last_call_narrative].map(S).join(" ");
    const prices=xPrices(blob), durs=xDurs(blob);
    const bad=[];NAME_BAD.lastIndex=0;let nm;
    while((nm=NAME_BAD.exec(blob))!==null){
      if(paAttributed(blob,nm.index,nm.index+nm[0].length)&&!bad.includes(nm[1]))bad.push(nm[1]);}
    bad.sort();
    const multi=OTHER_PROG.test(blob)?1:0;
    r.multi_programme=multi;
    const def=[];
    if(!multi){
      if(prices.length&&prices.some(p=>p!==CANON_PRICE))def.push("PRICE_OFF_LIST");
      if(prices.length>2)def.push("MULTIPLE_PRICES_IN_ONE_CALL");
    }
    if(durs.length&&!durs.includes(CANON_WEEKS))def.push("DURATION_WRONG");
    if(bad.length)def.push("PROGRAMME_NAME_MANGLED");
    r.prices_quoted=prices.map(p=>p.toLocaleString("en-US")).join(";");
    r.durations_quoted_weeks=durs.join(";");
    r.names_mangled=bad.join(";");
    r.message_defects=def.join(";"); r.message_defect_count=def.length;
    const end=S(a.stop_context)+" "+S(a.last_call_outcome);
    const opens=[],owners=new Set();
    COMMITS.forEach(([k,pat,who])=>{if(pat.test(end)){opens.push(k);owners.add(who)}});
    r.open_commitments=opens.join(";");
    r.commitment_owner=owners.size>1?"BOTH":(owners.size?[...owners][0]:"NONE");
    const conv=S(a.complete_conversation_narrative)+" "+S(a.profile_discovery_verbatim);
    r.gatekeeper=GATE_RE.test(conv)?1:0;
    // existing IK students: upsell, not a closed deal
    const st0=S(r.lead_status), cls=S(r.latest_classification), alum=S(r.alumni_stats).toLowerCase();
    r.existing_student=(st0==="Enrolled"||cls==="ALREADY_ENROLLED"||alum.includes("alum"))?1:0;
    r.enrolled_in_fde=S(r.course).toUpperCase().includes("FDE")?1:0;
    const sd=S(r.sale_date).slice(0,10);
    r.sale_on=sd;
    r.enrolment_type = !r.existing_student ? "NOT_ENROLLED"
      : !sd ? "UNDATED_ENROLMENT"
      : sd < "2026-07-27" ? "OLD_ENROLMENT"
      : (r.enrolled_in_fde ? "NEW_SALE_FDE" : "NEW_SALE_OTHER_COURSE");
    r.enrolment_note = ({
      NEW_SALE_FDE:"Bought FDE after this campaign started. A real win from this webinar.",
      NEW_SALE_OTHER_COURSE:"Bought a different IK course after this campaign started. The cross-sell worked, but this is not an FDE sale - do not count it as one.",
      OLD_ENROLMENT:"Bought before this campaign started. An old student who came back - upsell.",
      UNDATED_ENROLMENT:"Marked as enrolled but this export has no sale date, so we cannot tell whether it is recent or years old. Pull the sale date from the CRM before deciding how to treat them.",
      NOT_ENROLLED:""})[r.enrolment_type];
    if(r.existing_student&&!r.enrolled_in_fde){
      let us=30;
      if(num(r.attended)===1)us+=20;
      us+=Math.min(25,num(r.total_tt)/10*25);
      us+=({HOT:20,WARM_P1:15,WARM_P2:12,WARM_P3:10,WARM:12,ALREADY_ENROLLED:8}[cls]??4);
      if(num(r.DCD_Flag)===1)us+=5;
      us=Math.round(Math.min(100,us)*10)/10;
      r.upsell_score=us;
      r.upsell_band=us>=70?"HOT":us>=55?"WARM":us>=42?"COOL":"COLD";
    } else { r.upsell_score=null; r.upsell_band=""; }
    // scenario
    const st=S(r.lead_status);
    let sc;
    if(r.enrolled_in_fde===1)sc="S01_WON_ENROLLED";
    else if(r.existing_student===1)sc="S19_EXISTING_STUDENT";
    else if(st==="Enrolled")sc="S01_WON_ENROLLED";
    else if(st==="Junk"||st==="Old Inactive (DO NOT USE)")sc="S02_DISQUALIFIED";
    else if(st.startsWith("Not interested"))sc="S03_LOST_NOT_INTERESTED";
    else if(r.gatekeeper===1)sc="S04_GATEKEEPER";
    else if(r.cohort==="NO_SHOW")sc=({NEVER_TOUCHED:"S05_NOSHOW_NEVER_TOUCHED",UNDER_WORKED:"S06_NOSHOW_UNDER_WORKED",
      UNREACHABLE:"S07_NOSHOW_UNREACHABLE",ENGAGED_NO_SHOW:"S08_NOSHOW_ENGAGED",
      BRIEF_CONTACT_NO_SHOW:"S09_NOSHOW_BRIEF_CONTACT"}[r.noshow_type])||"S18_LOW_PRIORITY";
    else if(r.cohort==="ATTENDED_UNANALYSED")sc="S11_ATTENDED_NOT_ANALYSED";
    else if(num(r.worked_post_webinar)===0)sc="S10_ATTENDED_NEVER_WORKED";
    else if(["WEBINAR_REMINDER_ONLY","NO_CALLS_IN_SCOPE"].includes(S(a.call_type)))sc="S12_REMINDER_ONLY";
    else{
      const prog=S(a.program_discussed), pu=prog.toUpperCase();
      const drift=DRIFT_RE.test(prog)||(pu&&!pu.includes("FDE")&&!pu.includes("FORWARD")&&
        !pu.includes("NOT EXPLICITLY")&&!pu.includes("NOT AVAILABLE"));
      if(drift)sc="S13_WRONG_PROGRAM_PITCHED";
      else if(["HOT","WARM"].includes(S(a.temperature))&&a.cqs!=null&&a.cqs<45)sc="S14_BAD_PITCH_LIVE_LEAD";
      else if(r.open_commitments)sc="S15_GOOD_PITCH_OPEN_LOOP";
      else if(S(a.next_step_status)==="NOT_DEFINED")sc="S16_GOOD_PITCH_NO_NEXT_STEP";
      else if(["COOL","WARM","HOT"].includes(S(a.temperature)))sc="S17_NURTURE";
      else sc="S18_LOW_PRIORITY";}
    r.scenario=sc;
    const meta=SCMETA.find(x=>x.code===sc)||{};
    r.scenario_meaning=meta.meaning||""; r.scenario_why=meta.why||"";
    r.scenario_play=meta.play||""; r.scenario_owner=meta.owner||""; r.scenario_sla=meta.sla||"";
  });
  return univ;}

function tbl(cols,rows,onRow){
  return `<div class="tw"><table><thead><tr>${cols.map((c,i)=>
    `<th class="${c.n?'n':''}" onclick="sortBy(${i})">${c.h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r,ri)=>`<tr class="${onRow?'click':''}" ${onRow?`onclick="${onRow}(${ri})"`:""}>
    ${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
let SORT={dir:1};
function sortBy(i){
  SORT.dir*=-1;const t=event.target.closest(".tw").querySelector("tbody");if(!t)return;
  [...t.rows].sort((a,b)=>{const x=a.cells[i]?.innerText.trim()||"",y=b.cells[i]?.innerText.trim()||"";
    const nx=parseFloat(x.replace(/[^\d.\-]/g,"")),ny=parseFloat(y.replace(/[^\d.\-]/g,""));
    if(!isNaN(nx)&&!isNaN(ny))return (nx-ny)*SORT.dir;
    return x.localeCompare(y)*SORT.dir}).forEach(r=>t.appendChild(r));
}

/* ============ WHAT WAS ACTUALLY SAID — defect popups ============
   Instead of a count, every number on the Wrong info page opens the exact sentence
   from the call where the wrong thing was said, next to what it should have been. */

const SRC_FIELDS=[
 ["program_details_shared",   "What the advisor told them about the course"],
 ["pa_fde_introduction_verbatim","How the advisor introduced FDE"],
 ["urgency_creation_verbatim","How they tried to create urgency"],
 ["last_call_narrative",      "Summary of the last call"],
 ["complete_conversation_narrative","Full story across all calls"],
];
const CANON_PRICE_TXT="₹2,75,000";
const CANON_WEEKS_TXT="23 weeks";

/* pull the sentence(s) around a match so the quote has context but stays short */
function snips(text,re,pad){
  const t=S(text); if(!t.trim())return [];
  const out=[]; let m; const rx=new RegExp(re.source,re.flags.includes("g")?re.flags:re.flags+"g");
  rx.lastIndex=0;
  while((m=rx.exec(t))!==null){
    const i=m.index;
    let a=t.lastIndexOf(".",i-1), b=t.indexOf(".",i+m[0].length);
    let a2=t.lastIndexOf("|",i-1), b2=t.indexOf("|",i+m[0].length);
    if(a2>a)a=a2; if(b2>-1&&(b===-1||b2<b))b=b2;
    a=a===-1?Math.max(0,i-(pad||130)):a+1;
    b=b===-1?Math.min(t.length,i+m[0].length+(pad||130)):b+1;
    let q=t.slice(a,b).trim();
    if(q.length>420)q=q.slice(0,420)+"…";
    if(q&&!out.some(x=>x.q===q))out.push({q,hit:m[0]});
    if(out.length>=3)break;
    if(rx.lastIndex<=i)rx.lastIndex=i+1;
  }
  return out;
}
function hi(q,hit){
  if(!hit)return esc(q);
  const i=q.toLowerCase().indexOf(S(hit).toLowerCase());
  if(i<0)return esc(q);
  return esc(q.slice(0,i))+`<mark>${esc(q.slice(i,i+hit.length))}</mark>`+esc(q.slice(i+hit.length));
}

/* build the evidence for one lead and one kind of defect */
function defectEvidence(id,kind){
  const call=ROWS.find(r=>String(r.hubspot_id)===String(id));
  const u=UNIV.find(r=>String(r.hubspot_id)===String(id))||{};
  if(!call)return [];
  const out=[];
  const BAD_CTX=/(emi|instal?ment|payment|loan|tenure|financ|notice period|experience|years? of|validity|access|warrant|subscription|refund|guarantee|delay|within the next|from now|by then|placement|joining|switch|target)/i;
  const GOOD_CTX=/(program|programme|course|batch|cohort|curriculum|class|session|module|duration|long|track|training|spans?|comprise|last)/i;
  const scan=(re,label,should,checkCtx)=>{
    SRC_FIELDS.forEach(([f,fl])=>{
      snips(call[f],re).forEach(s=>{
        if(checkCtx&&(BAD_CTX.test(s.q)||!GOOD_CTX.test(s.q)))return;   // not about the course length
        if(kind==="name"&&/misunder|mishear|lead:|prospect:|lead was the one|the lead .{0,40}(mentioned|said|asked|called)/i.test(s.q))return;  // the lead said it
        out.push({field:fl,quote:s.q,hit:s.hit,label,should});
      });
    });
  };
  if(kind==="price"){
    const list=S(u.prices_quoted).split(";").filter(Boolean);
    list.forEach(p=>{
      const n=parseInt(p.replace(/,/g,""),10);
      if(n===275000)return;
      const inr=n.toLocaleString("en-IN");
      const alt=[inr,n.toLocaleString("en-US"),String(n),
                 (n%100000===0?(n/100000)+" lakh":null),
                 (n%100000===0?(n/100000)+" lac":null)].filter(Boolean)
                 .map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
      scan(new RegExp("(?:₹|Rs\\.?\\s?|INR\\s?)?(?:"+alt+")","gi"),
           "Said ₹"+inr, "Approved FDE price is "+CANON_PRICE_TXT);
    });
  }
  if(kind==="duration"){
    S(u.durations_quoted_weeks).split(";").filter(Boolean).forEach(w=>{
      if(w==="23")return;
      const wk=parseInt(w,10), mo=Math.round(wk/4.345);
      const pats=[`\\b${wk}\\s*[-\\s]*weeks?\\b`];
      if(mo>=1&&mo<=24)pats.push(`\\b${mo}\\s*[-\\s]*months?\\b`);
      scan(new RegExp(pats.join("|"),"gi"),
           "Said about "+wk+" weeks", "The brochure says "+CANON_WEEKS_TXT, true);
    });
  }
  if(kind==="name"){
    S(u.names_mangled).split(";").filter(Boolean).forEach(nm=>{
      scan(new RegExp("\\b"+nm.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","g"),
           'Called it "'+nm+'"', "It is FDE, or Forward Deployed Engineer");
    });
  }
  return out;
}

           fix:"Publish one price and one discount rule in writing, and have every advisor read it aloud once."},
 duration:{title:"Wrong course length said",
           why:"Your own brochure says 23 weeks. Anything else is a promise nobody agreed to, and the learner will hold you to it.",
           fix:"Put 23 weeks on the one-page fact card and stop anyone saying months."},
 name:    {title:"Course called the wrong thing",
           why:"FD, FTE, FBE, FDA, NFDI, Power Deployment Engineer. You cannot build a new category when the team selling it cannot say its name.",
           fix:"Say the full name once at the start of every call: Forward Deployed Engineer, FDE for short."},
 multi:   {title:"Two or more FDE prices inside one call",
           why:"This is discounting invented on the spot. It teaches the person to haggle, and it tells them the first number was never real.",
           fix:"One price, one discount rule. Any exception goes through a manager before the call, not during it."},
};

      </div>`;
    if(kind==="price"||kind==="multi"){
      const list=S(r.prices_quoted).split(";").filter(Boolean);
      h+=`<div class="dfrow"><span class="dfk">Prices said on this call</span>
        ${list.map(p=>{const n=parseInt(p.replace(/,/g,""),10);
          return `<span class="pill ${n===275000?"good":"hot"} mono">₹${n.toLocaleString("en-IN")}</span>`}).join("")}
        <span class="dfsep">should be</span><span class="pill good mono">${CANON_PRICE_TXT}</span></div>`;
    }
    if(kind==="duration"){
      const list=S(r.durations_quoted_weeks).split(";").filter(Boolean);
      h+=`<div class="dfrow"><span class="dfk">Lengths said on this call</span>
        ${list.map(w=>`<span class="pill ${w==="23"?"good":"hot"} mono">${w} weeks</span>`).join("")}
        <span class="dfsep">should be</span><span class="pill good mono">${CANON_WEEKS_TXT}</span></div>`;
    }

      shown++;

        around it was not captured in the transcript fields we have. Open the lead to read the full call.</div></div>`;
    }
    h+=`</div>`;
  });
  h=h.replace("<!--STATS-->","");
  $("dBody").innerHTML=`<div class="mute" style="font-size:12px;margin-bottom:12px">
    Quotes found for ${shown} of ${rows.length} leads${noquote?` · ${noquote} had the value but no quotable sentence`:""}.
    </div>`+h;
  openDrawer();
}

/* one price, everyone who heard it */
function pricePopup(n){
  const rows=UNIV.filter(r=>S(r.prices_quoted).split(";").includes(n.toLocaleString("en-US")));
  const ok=n===275000;
  DRILL={rows,cols:DRILL_COLS_UNIV,name:"price_"+n};
  $("dEyebrow").textContent="One price, and who heard it";
  $("dTitle").textContent="₹"+n.toLocaleString("en-IN");
  $("dCtx").textContent=`${rows.length} lead${rows.length===1?"":"s"} were told this number`;
  let h=ok?`<div class="callout ok"><h4>This is the approved price</h4>
      <p>Nothing to fix here. These are the calls that got it right.</p></div>`
    :`<div class="callout"><h4>This is not the approved price</h4>
      <p>The approved FDE price is <b>${CANON_PRICE_TXT}</b>. These ${rows.length} people were told
      <b>₹${n.toLocaleString("en-IN")}</b> instead. Every quote below is word for word.</p></div>`;
  rows.forEach(r=>{
    const call=ROWS.find(x=>String(x.hubspot_id)===String(r.hubspot_id))||{};
    const inr=n.toLocaleString("en-IN");
    const alt=[inr,n.toLocaleString("en-US"),String(n),(n%100000===0?(n/100000)+" lakh":null)]
      .filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    const re=new RegExp("(?:₹|Rs\\.?\\s?|INR\\s?)?(?:"+alt+")","gi");
    let evs=[];
    SRC_FIELDS.forEach(([f,fl])=>snips(call[f],re).forEach(s=>evs.push({field:fl,...s})));
    h+=`<div class="dfc"><div class="dfhead">
      <span class="pill mono">${esc(r.hubspot_id)}</span><b>${esc(r.pa_name_final)}</b>
      <span class="pill">${esc(r.pod_final)}</span>
      ${num(r.multi_programme)===1?`<span class="pill warm">another IK course also discussed</span>`:""}
      <span style="margin-left:auto"><button class="gh" onclick="openWrongLead('${esc(r.hubspot_id)}')">Open lead ↗</button></span>
      </div>`;
    if(evs.length)evs.slice(0,3).forEach(e=>{
      h+=`<div class="dfq"><div class="dfqh">${esc(e.field)}</div><div class="dfqt">${hi(e.q,e.hit)}</div></div>`});
    else h+=`<div class="dfq empty"><div class="dfqt">No quotable sentence captured. Open the lead for the full call.</div></div>`;
    h+=`</div>`;
  });
  $("dBody").innerHTML=h;openDrawer();
}

function xBase(){

function xApply(skip){
  let rows=xBase();

    if(k===skip)return;
    if(MULTI.some(m=>m.k===k))rows=rows.filter(r=>S(r[k]).split(";").includes(v));
    else rows=rows.filter(r=>S(r[k])===v);
  });
  return rows;
}

   window._XR,"openExplore");
  return h+"</section>";
}
function openExplore(i){

function exportExplore(){
  const rows=window._XR||[]; if(!rows.length)return;
  const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const q=v=>`"${S(v).replace(/"/g,'""')}"`;
  const csv=[cols.join(",")].concat(rows.map(r=>cols.map(c=>q(r[c])).join(","))).join("\n");
  const b=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  const tag=Object.values(XF).join("_").replace(/\W+/g,"_").slice(0,40)||"all";
  a.download=`FDE_explore_${tag}_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

/* ---------- matching, no API ---------- */
const STOP=new Set(["the","a","an","is","are","do","does","how","what","i","to","for","in","of","and","my","we",
 "should","can","if","it","they","them","he","she","on","at","with","that","this","be","have","has","not","you","your"]);
function tokens(q){return S(q).toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w))}
function matchCards(q){
  const t=tokens(q); if(!t.length)return [];
  return CARDS.map(c=>{
    const hay=(c.kw+" "+c.q+" "+c.topic).toLowerCase();
    let sc=0;
    t.forEach(w=>{
      if(hay.includes(" "+w+" ")||hay.startsWith(w+" ")||hay.endsWith(" "+w))sc+=3;
      else if(hay.includes(w))sc+=1;
      if(w.length>4&&hay.includes(w.slice(0,Math.max(4,w.length-2))))sc+=0.5;
    });
    return {c,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.c);
}

 B:["Finish what we started","var(--amb)","Interest you already paid for, going cold right now."],
 C:["Fix the system","var(--cy-d)","So the same mistakes do not happen with the next batch."],
 D:["Check it is working","var(--grn)","The only way to know if any of the above worked."]};
const STEP_DRILL={3:"S08_NOSHOW_ENGAGED",4:"S10_ATTENDED_NEVER_WORKED",5:"S14_BAD_PITCH_LIVE_LEAD",
 7:"S16_GOOD_PITCH_NO_NEXT_STEP",8:"S12_REMINDER_ONLY",9:"S11_ATTENDED_NOT_ANALYSED",10:"S13_WRONG_PROGRAM_PITCHED"};
function pagePlan(){
  let h=`<section><div class="eyebrow">Section 2 · The plan</div><h1 class="pg">Do this next</h1>
   <p class="lede">In order, not just a list. Each step tells you what to do, why it matters, who does it, by when, and how
   you will know it worked. Steps with a lead list attached open when you click them. Start with group A — that is the only
   group where the problem gets bigger while you wait.</p>`;
  ["A","B","C","D"].forEach(b=>{
    const [name,col,sub]=BLOCK_META[b];
    h+=`<div style="margin-top:26px;display:flex;align-items:baseline;gap:13px">
      <span class="mono" style="font-size:25px;font-weight:600;color:${col}">${b}</span>
      <div><div style="font-size:17px;font-weight:800;letter-spacing:-.02em">${name}</div>
      <div class="mute" style="font-size:12px">${sub}</div></div></div>`;
    PLAN.filter(p=>p.blk===b).forEach(p=>{
      const n=PLAN.indexOf(p)+1, sc=STEP_DRILL[n];
      const cnt=sc?UNIV.filter(r=>r.scenario===sc).length:null;
      const click=sc?` style="cursor:pointer" onclick="drillScenario('${sc}')"`:"";
      h+=`<div class="step" style="border-left-color:${col}"${click}>
        <div class="no">${String(n).padStart(2,"0")}</div>
        <div style="flex:1">
          <div style="font-size:14.5px;font-weight:700;margin-bottom:9px;letter-spacing:-.012em">${esc(p.action)}
            ${cnt!=null?`<span class="pill ${cnt?'hot':'good'}">${cnt} leads — click to see them</span>`:""}</div>
          <div style="display:flex;gap:26px;flex-wrap:wrap">
            <div style="flex:2;min-width:290px"><div class="fl" style="margin-top:0">Why this matters</div>
              <div style="font-size:12.5px;color:var(--body);line-height:1.7;margin-top:5px">${esc(p.why)}</div></div>
            <div style="flex:1;min-width:220px"><div class="fl" style="margin-top:0">How you will know it worked</div>
              <div style="font-size:12.5px;color:var(--body);line-height:1.7;margin-top:5px">${esc(p.verify)}</div></div>
          </div>
          <div style="margin-top:12px">
            <span class="pill cool">${esc(p.owner)}</span>
            <span class="pill ${/24|48/.test(p.when)?"hot":"warm"}">${esc(p.when)}</span>
            <span class="pill mono">${esc(p.ev)}</span></div>
        </div></div>`});
  });
  return h+"</section>";}
function drillScenario(code){
  const m=SCMETA.find(x=>x.code===code)||{};
  drill("Scenario "+code,m.meaning||code,(m.why||"")+" — The play: "+(m.play||""),
        UNIV.filter(r=>r.scenario===code),"univ");
}

/* ============ 03 SCENARIOS ============ */

  if(!UNIV.length)return noDB("Scenarios");

  const rows=SCMETA.map(m=>({...m,n:UNIV.filter(r=>r.scenario===m.code).length}));
  const urgent=rows.filter(m=>/24h|48h/.test(m.sla)).reduce((a,m)=>a+m.n,0);
  let h=`<section><div class="eyebrow">Section 3 · Where every lead stands</div>
   <h1 class="pg">Lead states</h1>
   <p class="lede">Every lead who signed up is in one state only, so the counts always add up to ${tot}. If a lead could
   fit two states, the one higher up the list wins — someone who said no and also did not attend counts as a no.
   Click any row to see those leads.</p>
   <div class="kpis">
    ${kpi("M01",tot,"everyone who signed up for the webinar","a","drill('Metric M01','Registered base','"+esc(D("M01"))+"',UNIV,'univ')")}
    ${kpi("M02",UNIV.filter(r=>r.cohort==="ATTENDED_ANALYSED").length,`out of ${tot} who signed up`,"g","drill('Group','Came, and calls read','"+esc(D("M02"))+"',UNIV.filter(r=>r.cohort==='ATTENDED_ANALYSED'),'univ')")}
    ${kpi("M21",UNIV.filter(r=>S(r.open_commitments)).length,`${pct(UNIV.filter(r=>S(r.open_commitments)).length,tot)} of ${tot}`,"w","drill('Metric M21','Open commitments','"+esc(D("M21"))+"',UNIV.filter(r=>S(r.open_commitments)),'univ')")}
    ${kpi("M22",UNIV.filter(r=>r.fde_fit==="STRETCH").length,`${pct(UNIV.filter(r=>r.fde_fit==="STRETCH").length,tot)} of ${tot}`,"r","drill('Metric M22','STRETCH fit profiles','"+esc(D("M22"))+"',UNIV.filter(r=>r.fde_fit==='STRETCH'),'univ')")}
   </div>
   <div class="card" style="margin-top:18px;padding:0;overflow:hidden">
   <div class="tw" style="border:none;box-shadow:none;max-height:none"><table><thead><tr>
   <th>#</th><th>State</th><th class="n">Leads</th><th class="n">Out of ${tot}</th><th>What it means</th>
   <th>Why they end up here</th><th>What to do</th><th>Who</th><th>By when</th></tr></thead><tbody>`;
  rows.forEach((m,i)=>{const u=/24h|48h/.test(m.sla);
    h+=`<tr class="click" onclick="drillScenario('${m.code}')">
      <td class="mono mute">${String(i+1).padStart(2,"0")}</td>
      <td><b class="mono" style="font-size:11px">${m.code}</b>
        <div class="bar" style="margin-top:5px"><i style="width:${Math.min(100,m.n/tot*400)}%;background:${u?'var(--red)':'var(--cy)'}"></i></div></td>
      <td class="n"><b>${m.n}</b></td><td class="n">${pct(m.n,tot)}</td>
      <td style="max-width:230px">${esc(m.meaning)}</td>
      <td style="max-width:270px;color:var(--mute)">${esc(m.why)}</td>
      <td style="max-width:380px">${esc(m.play)}</td>
      <td><span class="pill cool">${esc(m.owner)}</span></td>
      <td><span class="pill ${u?'hot':''}">${esc(m.sla)}</span></td></tr>`});
  h+=`</tbody></table></div></div>`;

  const FITN={CORE:"Hands-on engineer. They already meet the entry bar — pitch FDE straight away.",
   CORE_SENIOR:"Hands-on but 20+ years in. Check they still write code day to day.",
   ADJACENT:"Close, but they need to build both the AI side and the customer side. Sell it as a climb, not a sideways move.",
   ADJACENT_SENIOR:"Close and very senior. Check they still write code before pitching.",
   STRETCH:"Manager or PM. Our own scorecard says they need to get back into coding first. Check hard, or you are selling a refund.",
   UNKNOWN:"We never recorded their role. Fix the form — you cannot target what you do not record."};
  h+=`<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
   <div class="card"><h3>3.1 · Is this person even right for FDE?</h3>
   <div class="sub">Based on IK's own entry requirements and the FDE scorecard. This is about who we target, not how good the call was. Click a band to see them.</div>`;
  const fits=["CORE","CORE_SENIOR","ADJACENT","ADJACENT_SENIOR","STRETCH","UNKNOWN"];
  const fmax=Math.max(...fits.map(f=>UNIV.filter(r=>r.fde_fit===f).length),1);
  fits.forEach(f=>{const v=UNIV.filter(r=>r.fde_fit===f).length; if(!v)return;
    h+=`<div class="hbar click" onclick="drill('FDE fit','${f}','${esc(FITN[f])}',UNIV.filter(r=>r.fde_fit==='${f}'),'univ')">
      <div class="nm mono" style="font-size:10.5px">${f}</div>
      <div class="tr"><i style="width:${v/fmax*100}%;background:${f==="STRETCH"?"var(--red)":"var(--cy)"}"></i></div>
      <div class="vn">${v} · ${pct(v,tot)}</div></div>
      <div style="font-size:11.5px;color:var(--mute);margin:-3px 0 9px 210px">${FITN[f]}</div>`});
  h+=`</div><div class="card"><h3>3.2 · Promises to chase</h3>
   <div class="sub">Things promised on either side and not done. The CRM tracks none of this — and breaking a small promise is the cheapest way to lose a warm lead.</div>`;
  const CT=[["RESUME_FROM_LEAD","Lead to send their CV","They said they would send a CV."],
   ["WHATSAPP_FROM_PA","We owe a WhatsApp message","The advisor said they would message them."],
   ["CALLBACK_FROM_PA","We owe a call back","The advisor said they would ring back."],
   ["BROCHURE_FROM_PA","We owe the brochure","The advisor said they would send it."],
   ["CURRICULUM_FROM_PA","We owe the curriculum","The advisor said they would send it."],
   ["MANAGER_INTRO_FROM_PA","We owe a manager call","The advisor offered to bring a manager in."],
   ["PAYMENT_FROM_LEAD","Lead to complete payment","A payment link was sent."]];
  const cmax=Math.max(...CT.map(([t])=>UNIV.filter(r=>S(r.open_commitments).includes(t)).length),1);
  CT.forEach(([t,label,def])=>{const v=UNIV.filter(r=>S(r.open_commitments).includes(t)).length;
    h+=`<div class="hbar click" onclick="drill('Promise to chase','${esc(label)}','${esc(def)}',UNIV.filter(r=>S(r.open_commitments).includes('${t}')),'univ')">
      <div class="nm">${label}</div>
      <div class="tr"><i style="width:${v/cmax*100}%;background:var(--amb)"></i></div><div class="vn">${v}</div></div>`});
  const own=UNIV.filter(r=>S(r.open_commitments));
  h+=`<div class="fl">Who owes what</div>
   <div style="font-size:12.5px;color:var(--body);margin-top:6px;line-height:1.7">
   <b>${own.filter(r=>r.commitment_owner==="PA").length}</b> we owe them ·
   <b>${own.filter(r=>r.commitment_owner==="LEAD").length}</b> they owe us ·
   <b>${own.filter(r=>r.commitment_owner==="BOTH").length}</b> both ways.
   Chase the exact thing by name. Never send a general "just following up".</div></div></div>`;
  return h+"</section>";}

  const grpCol=g=>g==="Non-IQL"?"var(--red)":g==="IQL only"?"var(--amb)":"var(--navy)";
  const top=FUNNEL[0].n;
  let h=`<section><div class="eyebrow">Section 2 · Where all the numbers come from</div>
   <h1 class="pg">Funnel</h1>
   <p class="lede">Different pages count different groups of people. This page says exactly who each number covers,
   so 292 and 158 and 135 and 77 never get mixed up again. The colour on each row tells you which group it is.</p>
   <div class="kpis">
    ${kpi("M27",FUNNEL[0].n,"IQL plus the non-IQL we know about, this webinar only","a","drill('All leads','Everyone who signed up for this webinar','"+esc(D("M27"))+"',UNIV,'univ')")}
    ${kpi("M01",FUNNEL[1].n,`${pct(FUNNEL[1].n,top)} of ${top} · passed the lead filter`,"g","drill('IQL','Passed the lead filter','"+esc(D("M01"))+"',UNIV,'univ')")}
    ${kpi("M25",FUNNEL[2].n,`${pct(FUNNEL[2].n,top)} of ${top} · failed the lead filter`,"r","drill('Non-IQL','Failed the lead filter but came anyway','"+esc(D("M25"))+"',NONIQL,'nq')")}
    ${kpi("M02",FUNNEL[6].n,`${pct(FUNNEL[6].n,FUNNEL[4].n)} of the ${FUNNEL[4].n} IQL who came`,"a","drill('Calls read','IQL leads whose calls we have read','"+esc(D("M02"))+"',ROWS)")}
   </div>
   <div class="card" style="margin-top:18px"><h3>2.1 · Every step, and who it counts</h3>
   <div class="sub">Indented rows are a breakdown of the row above. Click any row to open its leads.</div>`;
  FUNNEL.forEach((f,i)=>{
    const w=top?f.n/top*100:0;
    const clickable = f.grp!=="Non-IQL" || true;
    h+=`<div class="fnrow" onclick="funnelDrill(${i})" style="${f.lvl?'padding-left:26px':''}">
      <div class="st">${String(i+1).padStart(2,"0")}</div>
      <div class="lb">${esc(f.label)}
        <span class="pill" style="background:${grpCol(f.grp)}15;color:${grpCol(f.grp)}">${f.grp}</span></div>
      <div class="bx"><i style="width:${Math.max(w,2)}%;background:${f.grp==="Non-IQL"?"linear-gradient(90deg,#9E3B2E,var(--red))":f.grp==="IQL only"?"linear-gradient(90deg,#8A5A0B,var(--amb))":"linear-gradient(90deg,var(--cy-d),var(--cy))"}"></i><span>${f.n}</span></div>
      <div class="dl">${f.base?`${(f.n/f.base*100).toFixed(1)}% of ${f.base}`:""}</div></div>`});
  h+=`</div>`;
  const KEY=[["311","IQL sign-ups plus the non-IQL people we have records for. The real non-IQL sign-up number is still missing."],
   ["292","IQL leads who signed up. This is everyone in the main Live DB sheet — it is already filtered to IQL, so no non-IQL lead is in there."],
   ["158","IQL leads who came to the webinar."],
   ["135","IQL leads whose calls we have read. Every call score is based on this. 23 came but their calls have not been read yet."],
   ["77","Of those 135, how many were real conversations rather than reminder calls. Every pitch-quality percentage is based on this."],
   ["19","Non-IQL people who came. They sit on a separate sheet and are NOT part of the 292."]];
  h+=`<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
   <div class="card"><h3>2.2 · What each number means</h3>
   <div class="sub">If a number on any other page confuses you, it is one of these six.</div>`;
  KEY.forEach(([n,d])=>{h+=`<div style="display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--s100)">
    <div class="mono" style="font-size:20px;font-weight:700;color:var(--navy);width:52px;flex-shrink:0">${n}</div>
    <div style="font-size:12.5px;color:var(--body);line-height:1.6">${d}</div></div>`});
  h+=`</div><div class="card"><h3>2.3 · Two things to check</h3>
   <div class="sub">Both need someone to confirm before these numbers are final.</div>
   <div class="callout" style="margin:0 0 12px"><h4>Your own Profiling tab disagrees</h4>
     <p>It says 287 signed up and 155 came. The current data says 292 and 158. That pivot looks like it was built
     before the last refresh. Please confirm which is right.</p></div>
   <div class="callout"><h4>Non-IQL sign-ups are missing</h4>
     <p>We only have the ${NONIQL.length} non-IQL people who <b>attended</b>. We do not have the non-IQL people who signed up
     and did not come. That is probably the biggest gap in this whole file — if 19 non-IQL people attended,
     several times that number likely signed up.</p></div></div></div>`;
  return h+"</section>";}
function funnelDrill(i){
  const f=FUNNEL[i];
  if(f.grp==="Non-IQL"){drill("Funnel step "+(i+1),f.label,f.note,NONIQL,"nq");return}
  if(f.grp==="IQL only"){
    const map={6:ROWS,7:UNIV.filter(r=>r.cohort==="ATTENDED_UNANALYSED"),
      8:ROWS.filter(r=>r.call_type==="SUBSTANTIVE_CONVERSATION"),
      9:ROWS.filter(r=>r.call_type==="WEBINAR_REMINDER_ONLY"),
      10:ROWS.filter(r=>r.call_type==="NO_CALLS_IN_SCOPE"),
      11:ROWS.filter(r=>r.framing_flag&&r.framing_flag!=="NOT_APPLICABLE"),
      12:ROWS.filter(r=>r.framing_flag==="COMPLIANT"),
      13:ROWS.filter(r=>["CREATED","PARTIAL"].includes(r.urgency_flag)),
      14:ROWS.filter(r=>r.next_step_status==="DEFINED"),
      15:ROWS.filter(r=>["HOT","WARM"].includes(r.temperature))};
    const rows=map[i]||ROWS;
    drill("Funnel step "+(i+1),f.label,f.note,rows, i===7?"univ":null);return}
  if(i===4){drill("Funnel step 5",f.label,f.note,UNIV.filter(r=>num(r.attended)===1),"univ");return}
  if(i===3){drill("Funnel step 4",f.label,f.note,UNIV.filter(r=>num(r.attended)===1),"univ");return}
  drill("Funnel step "+(i+1),f.label,f.note,UNIV,"univ");
}

  return Object.values(out).map(o=>{
    const R=o.rows,sub=R.filter(r=>r.call_type==="SUBSTANTIVE_CONVERSATION");

      rem:R.filter(r=>r.call_type==="WEBINAR_REMINDER_ONLY").length,cqs:a,

      weakp:R.filter(r=>["WEAK","NONE"].includes(r.probing_grade)).length,
      hw:R.filter(r=>["HOT","WARM"].includes(r.temperature)).length,

   {h:"FDE right",n:1,f:r=>r.comp},{h:"Hot",n:1,f:r=>r.hot},{h:"Warm",n:1,f:r=>r.warm},

   {h:"Avg lead score",n:1,f:r=>r.prio},{h:"Avg minutes",n:1,f:r=>r.tt},

  const mx=Math.max(...segs.map(s=>s.n),1);
  h+=`<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
    <div class="card"><h3>9.1 · How many in each group</h3><div class="sub">Where the leads actually are.</div>`;
  segs.slice(0,14).forEach(s=>{h+=`<div class="hbar click" onclick="openSeg(${segs.indexOf(s)})">
    <div class="nm">${esc(s.v)}</div><div class="tr"><i style="width:${s.n/mx*100}%;background:var(--cy)"></i></div>
    <div class="vn">${s.n} · ${pct(s.n,VIEW.length)}</div></div>`});

    <div class="sub">Share of each group that is hot or warm. This ignores group size, so small groups can still stand out. Minimum 3 leads.</div>`;
  segs.filter(s=>s.n>=3).sort((a,b)=>((b.hot+b.warm)/b.n)-((a.hot+a.warm)/a.n)).slice(0,14)
    .forEach(s=>{const p=(s.hot+s.warm)/s.n*100;
    h+=`<div class="hbar click" onclick="openSeg(${segs.indexOf(s)})"><div class="nm">${esc(s.v)}</div>

      <div class="vn">${p.toFixed(0)}% of ${s.n}</div></div>`});
  return h+"</div></div></section>";}

   {h:"No reason to join",n:1,f:s=>s.nourg},{h:"No next step",n:1,f:s=>s.nonext},
   {h:"Hot + warm",n:1,f:s=>s.hw},{h:"Change in call score",n:1,f:s=>{
     const i=SNAPS.indexOf(s),p=SNAPS[i+1];
     if(!p||p.cqs==null||s.cqs==null)return "—";
     const d=Math.round((s.cqs-p.cqs)*10)/10;
     return `<b style="color:${d>0?'var(--grn)':d<0?'var(--red)':'var(--mute)'}">${d>0?"+":""}${d}</b>`}}],SNAPS);
  const wc=SNAPS.filter(s=>s.cqs!=null).slice().reverse();
  if(wc.length>1){h+=`<div class="card" style="margin-top:16px"><h3>11.1 · Call score over time</h3>

    wc.forEach(s=>{h+=`<div class="hbar"><div class="nm mono" style="font-size:10.5px">${s.label}</div>
      <div class="tr"><i style="width:${s.cqs}%;background:${cqsCol(s.cqs)}"></i></div>
      <div class="vn" style="color:${cqsCol(s.cqs)}">${s.cqs}</div></div>`});h+=`</div>`}
  return h+"</section>";}
